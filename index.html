<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberglade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Emberglade — a solo adventure by firelight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a centred chat column over a mood-tinted backdrop; two fold-away drawers (tales left, sheet right). */
:root{
  --bg:#0d1410;--solid:#111813;--text:#dfe3da;--muted:#98a394;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);
  --s1:rgba(255,255,255,.035);--s2:rgba(255,255,255,.07);--s3:rgba(255,255,255,.12);
  --ember:#d9a55a;--ember2:#ecc98c;--emberdeep:#a8742f;--danger:#d0614a;--good:#86b870;
  --display:"Cormorant Garamond",Georgia,serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--story:var(--ui);
  --r:14px;color-scheme:dark;
}
body[data-mood=night]{--bg:#090d18;--solid:#0d1322;--ember:#8fb0ee;--ember2:#bccff7;--emberdeep:#5574b8}
body[data-mood=fire]{--bg:#140b09;--solid:#1a0f0c;--ember:#f08a4b;--ember2:#f8b98a;--emberdeep:#b84a22}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);font-size:15px;color:var(--text);background:var(--bg);overflow:hidden;transition:background-color 1.6s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* mood backdrops, cross-faded */
.bgl{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.8s ease;pointer-events:none}
#bg-forest{background:radial-gradient(1000px 520px at 50% -12%,rgba(150,190,120,.17),transparent 62%),radial-gradient(800px 600px at 0% 110%,rgba(60,120,80,.16),transparent 60%),linear-gradient(180deg,#111b15,#0b120e)}
#bg-night{background:radial-gradient(900px 520px at 70% -12%,rgba(120,150,230,.20),transparent 62%),radial-gradient(800px 600px at 0% 110%,rgba(50,70,150,.18),transparent 60%),linear-gradient(180deg,#0d1424,#070a13)}
#bg-fire{background:radial-gradient(1100px 560px at 50% 112%,rgba(240,110,50,.30),transparent 62%),radial-gradient(800px 480px at 50% -14%,rgba(200,60,40,.14),transparent 60%),linear-gradient(180deg,#1a0f0c,#110908)}
body[data-mood=forest] #bg-forest,body[data-mood=night] #bg-night,body[data-mood=fire] #bg-fire{opacity:1}
#flies{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;color:var(--ember2)}
#flies i{position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:0 0 9px 2px currentColor;opacity:0;animation:fly 14s ease-in-out infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}15%{opacity:.55}50%{opacity:.15;transform:translate(40px,-60px)}70%{opacity:.5}100%{opacity:0;transform:translate(-30px,-130px)}}
@media (prefers-reduced-motion:reduce){#flies{display:none}*{animation:none!important;transition:none!important}}

/* shell */
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
header.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ember2);background:none;border:0;padding:0}
.brand svg{width:22px;height:22px}
.bar .where{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.bar .where b{color:var(--text);font-weight:600}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--text);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px;transition:.15s background,.15s border-color}
.btn:hover{background:var(--s3);border-color:var(--ember)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ember);color:#17120a;border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--ember2)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.danger:hover{border-color:var(--danger);color:#ffb6a6}
.btn[aria-pressed=true]{border-color:var(--ember);color:var(--ember2)}
a.btn{text-decoration:none;display:inline-block}
:focus-visible{outline:2px solid var(--ember2);outline-offset:2px}
main{flex:1;min-height:0;overflow:auto}
.mem{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:none;white-space:nowrap}
.mem.ok{color:var(--good);border-color:rgba(134,184,112,.35)}
.mem.bad{color:#ffb6a6;border-color:var(--danger)}
.mem:hover{border-color:var(--ember)}
#memout,#testout{font-size:13px;min-height:18px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}

/* home + forms */
.wrap{max-width:940px;margin:0 auto;padding:36px 20px 60px}
.hero{text-align:center;padding:24px 0 30px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(42px,8vw,68px);margin:0;line-height:1;color:var(--text)}
.hero p{font-size:16px;color:var(--muted);max-width:520px;margin:14px auto 24px;line-height:1.6}
.notice{border:1px dashed var(--line2);background:var(--s1);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 24px;color:var(--ember2);flex-wrap:wrap}
h2.sec{font-family:var(--display);font-size:26px;font-weight:600;margin:28px 0 12px}
.saves{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.save{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.save h3{margin:0;font-family:var(--display);font-size:22px;color:var(--ember2)}
.save .meta{color:var(--muted);font-size:13px}
.save .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.panel{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:20px;margin-bottom:14px}
.panel h3{margin:0 0 14px;font-family:var(--display);font-size:22px;color:var(--ember2);font-weight:600}
.panel h3 small{font:500 13px var(--ui);margin-left:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;color:var(--text);font-size:15px;letter-spacing:0;text-transform:none;width:100%}
.inp:focus{border-color:var(--ember);outline:none}
select.inp option{background:var(--solid)}
textarea.inp{resize:vertical;min-height:80px}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.abil label{align-items:center;text-align:center}
.abil input{text-align:center;font-size:20px;font-family:var(--display);font-weight:700;padding:6px 2px}
.abil small{color:var(--ember2);letter-spacing:0;font-size:13px}
.hooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.hook{position:relative;border:1px solid var(--line);border-radius:12px;padding:13px;background:rgba(0,0,0,.18);cursor:pointer;display:block}
.hook input{position:absolute;opacity:0}
.hook b{display:block;font-family:var(--display);font-size:19px;margin-bottom:3px}
.hook span{color:var(--muted);font-size:13.5px;line-height:1.45}
.hook:has(input:checked){border-color:var(--ember);background:var(--s2);box-shadow:0 0 0 1px var(--ember) inset}
.hook:has(input:focus-visible){outline:2px solid var(--ember2)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;line-height:1.5}

/* game: drawers + chat */
#game{height:100%;display:flex;min-width:0}
.drawer{flex:none;width:0;overflow:hidden;transition:width .25s ease}
.drawer.open{width:310px}
.drawer>div{width:310px;height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#leftD{border-right:1px solid transparent}#leftD.open{border-right-color:var(--line)}
#rightD{border-left:1px solid transparent}#rightD.open{border-left-color:var(--line)}
#leftD.open,#rightD.open{background:rgba(0,0,0,.16)}
.tale{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 11px}
.tale:hover{background:var(--s2)}
.tale.on{background:var(--s2);border-color:var(--line2)}
.tale b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tale span{font-size:12px;color:var(--muted)}
.dlabel{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 4px 0}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
#log{flex:1;min-height:0;overflow:auto;padding:28px 18px 10px;font-size:16px;line-height:1.72;scroll-behavior:smooth}
.e{max-width:760px;margin:0 auto 22px}
.e p{margin:0 0 .85em}.e p:last-child{margin-bottom:0}
.e .lbl{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ember);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.e .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ember)}
.e.dm strong{color:#fff;font-weight:600}
.e.player{display:flex;justify-content:flex-end}
.e.player .bub{background:var(--s3);border-radius:18px 18px 5px 18px;padding:10px 16px;max-width:82%}
.e.roll{display:flex;justify-content:center}
.e.roll .bub{font-size:13.5px;line-height:1.45;background:var(--s1);border:1px solid var(--line2);color:var(--muted);border-radius:16px;padding:6px 14px;display:flex;gap:9px;align-items:center}
.e.roll svg{width:16px;height:16px;flex:none;color:var(--ember2)}
.e.err{font-size:14px;background:rgba(208,97,74,.14);border:1px solid rgba(208,97,74,.45);color:#ffd9cf;border-radius:12px;padding:10px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chg span{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--s2);color:var(--muted);border:1px solid var(--line)}
.chg .bad{color:#ffb6a6;border-color:rgba(208,97,74,.45)}
.chg .ok{color:var(--good);border-color:rgba(134,184,112,.35)}
.tools{margin-top:8px}
.tools button{font-size:12px;background:none;border:0;color:var(--muted);padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.tools button:hover{color:var(--ember2)}
.cursor::after{content:"";display:inline-block;width:.5em;height:1em;background:var(--ember);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{color:var(--muted)}
.composer{max-width:796px;width:100%;margin:0 auto;padding:6px 18px 18px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sugg button{font-size:13.5px;text-align:left;border:1px solid var(--line2);background:var(--s1);color:var(--text);border-radius:99px;padding:6px 13px}
.sugg button:hover{background:var(--s3);border-color:var(--ember)}
.rollcard{background:var(--s2);border:1px solid var(--ember);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rollcard .t{flex:1;min-width:200px}
.rollcard .t b{font-family:var(--display);font-size:20px;color:var(--ember2)}
.rollcard .t div{font-size:13px;color:var(--muted)}
.send{display:flex;gap:8px;align-items:flex-end;background:var(--s2);border:1px solid var(--line2);border-radius:24px;padding:7px 7px 7px 18px}
.send:focus-within{border-color:var(--ember)}
.send textarea{flex:1;border:0;background:none;color:var(--text);padding:8px 0;font-size:16px;line-height:1.45;resize:none;min-height:38px;max-height:160px;outline:none}
.send textarea::placeholder{color:var(--muted)}
.send .btn{width:38px;height:38px;padding:0;border-radius:50%;font-size:17px;flex:none}

/* sheet */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:rgba(0,0,0,.3);padding:4px;border-radius:12px;border:1px solid var(--line);position:sticky;top:0;z-index:2;backdrop-filter:blur(8px)}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 2px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--s3);color:var(--ember2)}
.card{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:14px}
.card h4{margin:0 0 10px;font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.who h3{margin:0;font-family:var(--display);font-size:25px;line-height:1.1}
.who .sub{color:var(--muted);font-size:13px;margin-top:3px}
.vitals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.vital{background:rgba(0,0,0,.25);border-radius:10px;padding:8px;text-align:center;border:1px solid var(--line)}
.vital b{display:block;font-family:var(--display);font-size:23px;line-height:1.1}
.vital span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hpbar{height:7px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:12px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#b5452f,#d9a55a 55%,#86b870);transition:width .4s}
.hprow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted)}
.hprow .btn{padding:1px 9px}
.xp{font-size:12px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;color:inherit}
.stat:hover,.skill:hover{border-color:var(--ember);background:var(--s2)}
.stat span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.05}
.stat small{color:var(--ember2);font-size:12px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.skill{display:flex;justify-content:space-between;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 7px;font-size:13px;text-align:left;color:var(--text)}
.skill.prof{color:var(--ember2)}
.skill.prof::before{content:"◆";font-size:8px;margin-right:4px;align-self:center}
.skill span{flex:1}.skill em{font-style:normal;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(208,97,74,.16);border:1px solid rgba(208,97,74,.4);color:#ffc1b3}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.22);font-size:14px}
ul.list li span{flex:1}ul.list li em{font-style:normal;color:var(--muted);font-size:13px}
ul.list li button{background:none;border:0;color:var(--muted);padding:0 4px;font-size:16px;line-height:1}
ul.list li button:hover{color:var(--danger)}
.addrow{display:flex;gap:6px;margin-top:10px}
.quest{padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.22);border-left:3px solid var(--ember);margin-bottom:8px}
.quest b{display:block;font-family:var(--display);font-size:18px}
.quest span{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.quest.done{border-color:var(--good);opacity:.7}.quest.done b{text-decoration:line-through}
.quest.failed{border-color:var(--danger);opacity:.7}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.die{aspect-ratio:1;border:1px solid var(--line2);border-radius:12px;background:var(--s2);font-family:var(--display);font-weight:700;font-size:19px}
.die:hover{border-color:var(--ember);color:var(--ember2);transform:translateY(-2px) rotate(-4deg)}
.dopts{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:10px}
.result{margin-top:12px;text-align:center;padding:14px 10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);min-height:96px}
.result b{display:block;font-family:var(--display);font-size:50px;line-height:1;color:var(--ember2)}
.result span{font-size:13px;color:var(--muted)}
.hist{margin-top:10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:auto}

.tray{position:relative;height:236px;border-radius:14px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line2);
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--ember) 20%,#1c1c1c),#0b0b0b 85%);box-shadow:inset 0 0 30px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.05);transition:border-color .3s,box-shadow .3s}
.tray.crit{border-color:#f0c64e;box-shadow:inset 0 0 38px rgba(240,200,80,.4)}
.tray.fumble{border-color:#c4503a;box-shadow:inset 0 0 38px rgba(200,60,40,.45)}
#tray3d{position:absolute;inset:0}
#tray3d canvas{width:100%;height:100%;display:block}
#tray2d{position:absolute;inset:0;align-items:center;align-content:center;gap:12px;padding:0 10px;pointer-events:none}
.tray .dw{width:54px;height:54px}.tray .d3{zoom:.63}
/* rolling dice */
#diceStage{position:fixed;left:0;right:0;bottom:150px;z-index:35;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .35s}
#diceStage.on{opacity:1}
.dicerow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.dw{position:relative;width:86px;height:86px;animation:slide 1.15s cubic-bezier(.15,.6,.3,1) both;animation-delay:var(--dl)}
.sh{position:absolute;left:8%;right:8%;bottom:-9px;height:16px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(5px);animation:shade 1.15s linear both;animation-delay:var(--dl)}
.d3{position:absolute;inset:0;display:grid;place-items:center;color:#1a1208;font:700 30px var(--display);animation:hop 1.15s linear both;animation-delay:var(--dl)}
.d3 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.d3 span{position:relative;display:block;line-height:1}
.d3.s4 span{margin-top:26px;font-size:24px}.d3.s8 span{margin-top:8px;font-size:25px}.d3.s10 span{margin-top:-4px;font-size:22px}
.d3.s12 span{font-size:25px}.d3.s20 span{margin-top:8px;font-size:21px}.d3.s100 span{margin-top:-4px;font-size:18px}
@keyframes slide{0%{transform:translateX(var(--dx))}100%{transform:none}}
@keyframes hop{
  0%{transform:translateY(-190px) rotate(var(--rot)) scale(.8);opacity:0;animation-timing-function:cubic-bezier(.5,0,1,.6)}
  8%{opacity:1}
  30%{transform:translateY(0) rotate(calc(var(--rot)*.52)) scale(1.05,.93);animation-timing-function:cubic-bezier(0,.5,.5,1)}
  47%{transform:translateY(-62px) rotate(calc(var(--rot)*.3));animation-timing-function:cubic-bezier(.5,0,1,.5)}
  64%{transform:translateY(0) rotate(calc(var(--rot)*.13)) scale(1.03,.96);animation-timing-function:cubic-bezier(0,.5,.5,1)}
  76%{transform:translateY(-22px) rotate(calc(var(--rot)*.05));animation-timing-function:cubic-bezier(.5,0,1,.5)}
  88%{transform:translateY(0) rotate(calc(var(--rot)*.012))}
  94%{transform:translateY(-5px) rotate(0)}
  100%{transform:none;opacity:1}}
@keyframes shade{0%{transform:scale(.35);opacity:0}30%{transform:scale(1);opacity:1}47%{transform:scale(.6);opacity:.45}64%{transform:scale(1);opacity:1}76%{transform:scale(.82);opacity:.7}88%,100%{transform:scale(1);opacity:1}}
.d3.land{animation:land .3s ease-out}

function rollExpr(expr,crit){
  const m = /^\s*(\d*)\s*d\s*(\d+)\s*([+-]\s*\d+)?\s*$/i.exec(String(expr||''));

const dieSVG = sides => { const f = FACETS[sides], n = f.length;

let box = null, boxState = '';
async function boxInit(){
  if(boxState) return boxState==='ok';

// Throws real dice in the tray and returns what they landed on: one array of values per group.
async function throwDice(groups,keep){
  let vals = null;
  if(await boxInit()){
    try{
      $('#tray2d').innerHTML = ''; box.resizeWorld();
      const note = groups.map(g=>`${g.n}d${g.sides}`), opt = diceLook();
      if(box._look!==opt.theme){ await within(box.updateConfig(opt),10000); box._look = opt.theme; }
      const res = await within(keep?box.add(note,opt):box.roll(note,opt),12000);
      const flat = (res||[]).map(x=>x.value); let k = 0;
      vals = groups.map(g=>{ const c = g.sides===100?1:g.n, v = flat.slice(k,k+c); k += c; return g.sides===100?v.map(x=>x===0?100:x):v; });
      if(k!==flat.length||!vals.every((v,i)=>v.length===(groups[i].sides===100?1:groups[i].n)&&v.every(x=>Number.isInteger(x)&&x>=1&&x<=groups[i].sides))) vals = null;
    }catch(e){ vals = null; }
  }
  if(!vals){
    if(box){ try{ box.clear(); }catch(e){} }
    vals = groups.map(g=>Array.from({length:g.sides===100?1:g.n},()=>rnd(g.sides)));
    await flatDice(vals.flatMap((v,i)=>v.map(x=>({sides:groups[i].sides,value:x}))));
  }
  return vals;
}

const RULES = `You are the Dungeon Master for a solo tabletop fantasy adventure that follows D&D 5th Edition style rules. One player controls one character. You run the world, its people, and its monsters.

How to narrate:
- Write in second person, present tense. Keep each reply to one to three short paragraphs of vivid, concrete prose. No headings, no bullet lists, no out-of-character commentary.
- Never decide what the player's character does, says, thinks, or feels. End each reply at a moment where the player chooses what to do next.
- Give the world texture: named people with wants of their own, places with history, choices with consequences. Let failures be interesting rather than dead ends.
- Stay consistent with the character sheet, inventory, quests, and the story so far given below. The player cannot use items or abilities they do not have.

Dice:
- You never roll dice for the player and never invent the result of a player roll. When the outcome of something the character attempts is uncertain and failure would matter, stop the narration just before the outcome and request a roll in the state block. The app rolls real dice and tells you the result in the next message. Then narrate what happens, honouring the result.
- Skilled and social actions always go to the dice when someone might resist or the attempt might fail. Persuading, deceiving or intimidating someone calls for Persuasion, Deception or Intimidation. Sneaking is Stealth, climbing, jumping or forcing something is Athletics, searching is Investigation, noticing is Perception, reading a person is Insight, picking a lock or a pocket is Sleight of Hand, and so on for the other 5e skills. Always name the matching "skill" and "ability" in the roll so the app can add the character's own modifier.
- A separate dice gate usually decides whether the player's action needs a roll, and the app rolls it before you write. When the player's latest message already carries a dice result from the app, never ask for that roll again: narrate what happens, honouring it. When an app note says no roll is needed, resolve the action directly. You may still request a roll yourself for something new that you introduce, such as a saving throw against a hazard or an attack the gate missed.
- Use sensible DCs: 5 trivial, 10 easy, 13 moderate, 16 hard, 19 very hard, 22+ heroic. Do not ask for rolls for trivial or automatic actions. Request at most one roll per reply.
- For a player attack, request a roll with "dc" set to the target's Armor Class and "damage" set to the weapon or spell damage dice including modifiers (for example "1d8+3"). The app rolls damage automatically on a hit.
- You resolve monster and NPC rolls yourself, fairly, against the character's AC and saves. Apply damage to the player with "hp_delta".

State block:
After the narration, end EVERY reply with one state block, exactly in this form, containing valid JSON. Include only the keys that changed, plus "mood" and "suggestions", which go in every reply. The player does not see this block.

<state>
{"mood":"forest","location":"short name of the current place","hp_delta":0,"gold_delta":0,"xp_delta":0,"items_add":[{"name":"Rusty key","qty":1}],"items_remove":[{"name":"Torch","qty":1}],"conditions_add":["Poisoned"],"conditions_remove":["Poisoned"],"quests":[{"title":"Quest name","status":"active","note":"one line on the current objective"}],"present":["Marta Quill"],"npcs":[{"name":"Marta Quill","about":"caravan master in her fifties, blunt, wants her wagons through by dawn"}],"roll":{"label":"Stealth check","ability":"dex","skill":"Stealth","save":false,"proficient":false,"advantage":"none","dc":13,"damage":null},"suggestions":["a short action the player might take","another","a third"]}
</state>

Notes on the keys: "mood" colours the app to match the scene and must be exactly one of: "forest" for outdoors, daylight, travel, calm or ordinary scenes; "night" for night-time, serene, quiet, eerie or stealthy scenes; "fire" for battle, mortal danger, anger or rage. "hp_delta" is negative for damage and positive for healing. "xp_delta" awards experience for overcoming challenges (a typical early encounter is worth 25 to 100). Quest "status" is "active", "done", or "failed". "present" lists the named non-player characters who are in the scene with the player right now, three at most, most important first; send it whenever it changes, and send [] when the player is alone. "npcs" introduces a named character the first time they appear, with one line about who they are. In "roll", "ability" is one of str, dex, con, int, wis, cha; "skill" is a 5e skill name or null; set "save" true for saving throws; set "proficient" true for attacks with weapons or spells the character is proficient with; "advantage" is "none", "adv", or "dis". Leave "roll" out entirely when no roll is needed. Always give three short "suggestions", but the player may do anything.`;

    }

  }

}

  try{
    out = await chat([{role:'system',content:GATE},{role:'user',content:`Scene: ${dm?clip(dm.text,500):'the adventure is just beginning'}
Character: level ${ch.level} ${ch.race} ${ch.cls}. ${ABIL.map(a=>a.toUpperCase()+' '+sgn(mod(ch.abilities[a]))).join(', ')}. Proficiency +${prof(ch.level)}. Carries: ${ch.inventory.map(i=>i.name).join(', ')||'nothing'}.
Action: ${text}${guess?`\n(Keyword guess from the app: ${guess}.)`:''}`}],{stream:false,maxTokens:300,temperature:0,model:store.settings.gateModel,quick:true,signal});
  }catch(e){ if(e.name==='AbortError') throw e; return fallback(); }
  const line = (out.trim().split('\n').filter(x=>/^\W*(yes|no)\b/i.test(x)).pop()||'').trim();
  if(!line) return fallback();
  if(/^\W*no\b/i.test(line)) return null;
  let m;
  if((m = /attack\D{0,12}(\d{1,2})\D{0,6}(\d*d\d+(?:\s*[+-]\s*\d+)?)?/i.exec(line))){ const dmg = m[2]&&rollExpr(m[2])?m[2].replace(/\s/g,''):null, fin = /bow|dart|rapier|dagger|sling/i.test(text)||mod(ch.abilities.dex)>mod(ch.abilities.str);
    return {label:'Attack',ability:fin?'dex':'str',skill:null,save:false,proficient:true,advantage:'none',dc:clamp(num(m[1]),5,30),damage:dmg||'1d6'+sgn(mod(ch.abilities[fin?'dex':'str'])).replace('−','-')}; }
  if((m = /save\W+(str|dex|con|int|wis|cha)\w*\D{0,8}(\d{1,2})?/i.exec(line))){ const a = m[1].toLowerCase(); return {label:ABIL_NAME[a]+' saving throw',ability:a,skill:null,save:true,proficient:false,advantage:'none',dc:clamp(num(m[2])||13,5,30),damage:null}; }
  const skill = Object.keys(SKILLS).sort((a,b)=>b.length-a.length).find(k=>line.toLowerCase().includes(k.toLowerCase()));
  if(skill){ const d = /(\d{1,2})\s*$/.exec(line.replace(/\W+$/,'')); return {label:skill+' check',ability:SKILLS[skill],skill,save:false,proficient:false,advantage:'none',dc:clamp(num(d&&d[1])||13,5,30),damage:null}; }
  return fallback();
}

// One model per person in the scene, three at most. Each decides what its character does next and keeps that character's sheet up to date.
const ACTOR = `You play exactly one non-player character in a solo D&D story. Stay strictly inside this character: what they know, what they want, how they talk. You do not narrate the world, you do not decide what the player character does, and you do not decide the result of any dice.
Reply with JSON only, in this form:
{"intent":"what you say and do in the next beat, one or two sentences","attitude":"one or two words for how you now feel about the player character","wants":"your current goal in a few words","new_traits":["a short trait this beat revealed or developed in you, only if it is genuinely new"]}`;
async function castBeat(c,signal){
  const names = (c.present||[]).filter(n=>c.npcs&&c.npcs[n]).slice(0,3); if(!names.length) return [];
  const ch = c.character, dm = lastOf(c,'dm'), tail = []; for(let i=c.log.length-1;i>=0&&c.log[i].role!=='dm';i--) tail.unshift(c.log[i]);
  const happened = `${dm?clip(dm.text,900):''}\n${tail.map(e=>e.role==='player'?`${ch.name} (the player character): ${e.text}`:`Dice: ${e.text}`).join('\n')}`;
  const out = await Promise.all(names.map(async name=>{ const n = c.npcs[name];
    try{
      const t = await chat([{role:'system',content:ACTOR},{role:'user',content:`Your sheet:\nName: ${n.name}\nAbout: ${n.about||'not yet described; define yourself through how you act'}\nTraits: ${(n.traits||[]).join(', ')||'none noted yet'}\nWants: ${n.wants||'unclear'}\nFeeling toward the player character: ${n.attitude||'neutral'}\n\nThe player character: ${ch.name}, a ${ch.race} ${ch.cls}. ${ch.appearance||''}\nOthers present: ${names.filter(x=>x!==name).join(', ')||'no one else'}\n\nWhat just happened:\n${happened}`}],
        {stream:false,maxTokens:400,temperature:0.8,model:store.settings.charModel,quick:true,signal});
      const j = jsonIn(t); if(!j||typeof j.intent!=='string'||!j.intent.trim()) return null;
      if(typeof j.attitude==='string'&&j.attitude.trim()) n.attitude = j.attitude.trim().slice(0,40);
      if(typeof j.wants==='string'&&j.wants.trim()) n.wants = j.wants.trim().slice(0,120);
      n.traits ||= []; for(const tr of (Array.isArray(j.new_traits)?j.new_traits:[])) if(typeof tr==='string'&&tr.trim()&&!n.traits.some(x=>x.toLowerCase()===tr.trim().toLowerCase())){ n.traits.push(tr.trim().slice(0,60)); if(n.traits.length>12) n.traits.shift(); }
      return {name:n.name,intent:j.intent.trim().slice(0,420)};
    }catch(e){ if(e.name==='AbortError') throw e; return null; } }));
  return out.filter(Boolean);
}

// Last pass: catches a draft that ignores the dice, plays the player's character for them, or contradicts the sheets.
const EDITOR = `You are the continuity editor for a solo D&D story. You are given the facts and the narrator's draft reply. Look only for real errors: the draft ignores or contradicts the dice result; it decides the player character's actions, words or feelings; it uses items, abilities or people that are not in the facts; a character acts against their sheet for no reason; the numbers in the state block do not match the narration.
If the draft is sound, reply with exactly: OK
Otherwise reply with the complete corrected reply in the same format (the narration, then the <state> block), changing as little as possible. No commentary.`;
async function continuity(c,text,state,intents,signal){
  const tail = []; for(let i=c.log.length-1;i>=0&&c.log[i].role!=='dm';i--) tail.unshift(c.log[i]);
  try{
    const out = await chat([{role:'system',content:EDITOR},{role:'user',content:`# Facts\n${sheetText(c)}\n\nPeople in the scene:\n${(c.present||[]).filter(n=>c.npcs&&c.npcs[n]).map(n=>npcLine(c.npcs[n])).join('\n')||'none'}${intents.length?`\nTheir intentions this beat:\n${intents.map(i=>`- ${i.name}: ${i.intent}`).join('\n')}`:''}\n\nLatest from the player:\n${tail.map(e=>e.role==='player'?e.text:'[Dice result] '+e.text).join('\n')||'(the adventure is opening)'}\n\n# Draft\n${text}\n\n<state>\n${JSON.stringify(state)}\n</state>`}],
      {stream:false,temperature:0.2,model:store.settings.checkModel,signal});
    if(!out.trim()||/^\W*ok\b/i.test(out.trim())) return null;
    const fixed = parseReply(out); if(fixed.text.length<text.length*0.4) return null;
    if(!Object.keys(fixed.state).length) fixed.state = state; return fixed;
  }catch(e){ if(e.name==='AbortError') throw e; return null; }
}
const needKey = () => { const s = store.settings; if(!s.apiKey&&/openrouter\.ai/i.test(s.baseUrl)){ openSettings('Add your OpenRouter API key first, so the narrator has a voice.'); return true; } return false; };
// A player's action goes to the dice gate first. A yes puts the roll card up and waits; a no goes straight to the story.
async function playerAct(text){
  if(busy||!cur||needKey()) return;
  const c = cur, entry = {role:'player',text}; c.log.push(entry);
  c.suggestions = []; c.pendingRoll = null; lastErr = null; busy = true; aborter = new AbortController(); save(); renderGame();
  setLive('Asking whether the dice are needed…');
  let g = null, stopped = false;
  try{ g = await gate(c,text,aborter.signal); }catch(e){ stopped = true; }
  busy = false; aborter = null; if(cur!==c) return;
  if(stopped){ renderGame(); return; }
  if(g){ c.pendingRoll = g; save(); renderGame(); return; }
  entry.noRoll = true; takeTurn(null);
}

async function takeTurn(entry){
  if(busy||!cur||needKey()) return;
  const c = cur, s = store.settings;
  if(entry) c.log.push(entry);
  c.suggestions = []; c.pendingRoll = null; lastErr = null; busy = true; aborter = new AbortController();
  save(); renderGame();
  const signal = aborter.signal; let raw = '', raf = 0, text = '', state = {}, fixed = false, live = setLive('The narrator considers…');
  try{
    let intents = [];
    const who = (c.present||[]).filter(n=>c.npcs&&c.npcs[n]).slice(0,3);
    if(who.length&&c.log.length){ live = setLive(`${who.join(', ').replace(/, ([^,]*)$/,' and $1')} ${who.length>1?'weigh':'weighs'} what to do…`); intents = await castBeat(c,signal); live = setLive('The narrator considers…'); }
    raw = await chat(buildMessages(c,intents),{signal,onText:t=>{ raw = t; if(raf) return; raf = requestAnimationFrame(()=>{ raf = 0; const v = visibleText(raw); if(v){ live.innerHTML = LBL+md(v); live.lastElementChild?.classList.add('cursor'); scrollLog(); } }); }});
    cancelAnimationFrame(raf); raf = 0; ({text,state} = parseReply(raw));
    if(text&&s.useCheck&&c.log.length){
      live.innerHTML = LBL+md(text)+'<div class="tools thinking">Checking that it all holds together…</div>'; scrollLog();
      const f = await continuity(c,text,state,intents,signal); if(f){ text = f.text; state = f.state; fixed = true; }
    }
  }catch(e){ if(e.name!=='AbortError'){ lastErr = e.message||String(e); text = ''; } else if(!text) ({text,state} = parseReply(raw)); }
  cancelAnimationFrame(raf); busy = false; aborter = null;
  if(cur!==c) return;
  if(text){
    const pre = snapshot(c);
    c.log.forEach(e=>{ delete e.pre; });
    const changes = applyState(c,state); if(fixed) changes.push({t:'Continuity pass adjusted this scene'});
    c.log.push({role:'dm',text,state,changes,pre});
    c.updated = Date.now();
  }else if(!lastErr&&!signal.aborted) lastErr = raw?'The model replied with no narration. Try again, or pick a different model.':'The model returned an empty reply. Try again, raise max tokens in Settings, or pick a different model.';
  save(); renderGame(); if(text) summarize(c);
}
function regenerate(){
  if(busy||!cur) return; const last = cur.log[cur.log.length-1];
  if(!last||last.role!=='dm'||!last.pre) return;
  Object.assign(cur,JSON.parse(last.pre)); cur.log.pop(); takeTurn(null);
}
async function summarize(c){
  const from = c.sumIdx||0; if(c.log.length-from<34||c._summing) return;
  c._summing = true; const take = c.log.slice(from,from+18);
  const script = take.map(e=>e.role==='dm'?'DM: '+e.text:e.role==='player'?'PLAYER: '+e.text:'DICE: '+e.text).join('\n\n');
  try{
    const t = await chat([{role:'system',content:'You keep the running record of a solo fantasy tabletop campaign. Merge the existing summary with the new transcript into one updated summary of at most 250 words. Keep names, places, promises, debts, enemies, unresolved threads, and important choices. Plain prose, past tense, no preamble.'},
      {role:'user',content:`Existing summary:\n${c.summary||'(none)'}\n\nNew transcript:\n${script}`}],{stream:false,maxTokens:500,temperature:0.3});
    if(t&&t.trim()){ c.summary = t.trim(); c.sumIdx = from+take.length; save(); }
  }catch(e){}
  delete c._summing;
}

/* ============ memory: cloud sync to a secret GitHub gist ============ */
const GH = 'https://api.github.com', MEMFILE = 'emberglade-memory.json';
let syncT = 0, syncing = false, syncAgain = false, memState = '', memErr = '';
function memLabel(){
  const s = store.settings, el = $('#mem'); if(!el) return;
  el.textContent = !s.memToken?'Saved on this device':memState==='sync'?'Syncing…':memState==='err'?'Memory sync failed':s.lastSync?'Memory synced '+new Date(s.lastSync).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Memory connected';
  el.className = 'mem'+(memState==='err'?' bad':s.memToken?' ok':'');
  const out = $('#memout'); if(out&&s.memToken){ out.style.color = memState==='err'?'var(--danger)':memState==='sync'?'var(--muted)':'var(--good)';
    out.textContent = memState==='err'?memErr:memState==='sync'?'Talking to GitHub…':s.lastSync?`Connected. ${Object.keys(store.campaigns).length} tale(s) held in memory.`:''; }
}
async function gh(path,opt={}){
  let r; try{ r = await fetch(GH+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+store.settings.memToken,...(opt.body?{'Content-Type':'application/json'}:{})}}); }
  catch(e){ throw new Error('Could not reach GitHub. Check your connection.'); }
  if(!r.ok){ const e = new Error(r.status===401?'GitHub rejected the token. Make a new one with the gist permission.':r.status===403?'GitHub refused (403). The token needs the gist permission.':'GitHub answered '+r.status+'.'); e.status = r.status; throw e; }
  return r.json();
}
const memCore = o => JSON.stringify([o.last||null,o.deleted||{},o.campaigns||{}]);
function memData(){ const campaigns = {}; for(const [id,c] of Object.entries(store.campaigns)){ const {_summing,...rest} = c; campaigns[id] = rest; }
  return {app:'emberglade',version:1,savedAt:Date.now(),last:store.last||null,deleted:store.deleted,campaigns}; }
function mergeRemote(r){
  let changed = false;
  for(const [id,ts] of Object.entries(r.deleted||{})) if(typeof ts==='number'&&!(store.deleted[id]>=ts)) store.deleted[id] = ts;
  for(const [id,rc] of Object.entries(r.campaigns||{})){
    if(!rc||!rc.character||!Array.isArray(rc.log)||store.deleted[id]>=(rc.updated||0)) continue;
    const lc = store.campaigns[id];
    if(lc&&(lc.updated||0)>=(rc.updated||0)) continue;
    if(cur&&cur.id===id&&busy) continue;
    rc.id = id; rc.quests ||= []; rc.suggestions ||= []; store.campaigns[id] = rc; changed = true;
    if(cur&&cur.id===id){ cur = rc; renderGame(); }
  }
  for(const id of Object.keys(store.campaigns)) if(store.deleted[id]>=(store.campaigns[id].updated||0)&&!(cur&&cur.id===id)){ delete store.campaigns[id]; changed = true; }
  if(r.last&&!store.last&&store.campaigns[r.last]){ store.last = r.last; changed = true; }
  return changed;
}
function scheduleSync(){ if(!store.settings.memToken) return; clearTimeout(syncT); syncT = setTimeout(sync,4000); }
async function sync(){
  const s = store.settings; if(!s.memToken) return;
  if(syncing){ syncAgain = true; return; }
  clearTimeout(syncT); syncing = true; memState = 'sync'; memLabel();
  try{
    if(!s.gistId){ const list = await gh('/gists?per_page=100'); const g = list.find(x=>x.files&&x.files[MEMFILE]); if(g) s.gistId = g.id; }
    if(s.gistId){
      let g = null; try{ g = await gh('/gists/'+s.gistId); }catch(e){ if(e.status!==404) throw e; s.gistId = ''; }
      if(g){
        const f = g.files&&g.files[MEMFILE]; let txt = f?f.content:''; if(f&&f.truncated) txt = await (await fetch(f.raw_url)).text();
        let remote = null; try{ remote = JSON.parse(txt); }catch(e){}
        if(remote&&mergeRemote(remote)){ saveLocal(); if(!cur&&!$('#createForm')) renderHome(); }
        const mine = memData();
        if(!remote||memCore(remote)!==memCore(mine)) await gh('/gists/'+s.gistId,{method:'PATCH',body:JSON.stringify({files:{[MEMFILE]:{content:JSON.stringify(mine)}}})});
      }
    }
    if(!s.gistId){ const g = await gh('/gists',{method:'POST',body:JSON.stringify({description:'Emberglade memory (campaign saves)',public:false,files:{[MEMFILE]:{content:JSON.stringify(memData())}}})}); s.gistId = g.id; }
    s.lastSync = Date.now(); memState = ''; memErr = '';
  }catch(e){ memState = 'err'; memErr = e.message||'Sync failed.'; }
  syncing = false; saveLocal(); memLabel();
  if(syncAgain){ syncAgain = false; scheduleSync(); }
}

/* ============ which check does an action call for? ============ */
const HINTS = [
  ['an attack roll',/\b(attack|strike|stab|slash|shoot|swing (my|at)|punch|kick|lunge|fire (an|my) arrow|hurl|throw (my|a) (dagger|axe|javelin|spear))/i],
  ['a Charisma (Persuasion) check',/\b(persuad|convinc|negotiat|bargain|haggle|plead|reason with|appeal to|charm|talk (him|her|them|my way)|ask (him|her|them) to)/i],
  ['a Charisma (Deception) check',/\b(lie\b|lying|bluff|deceiv|trick (him|her|them)|pretend|disguise|fake|make up a story)/i],
  ['a Charisma (Intimidation) check',/\b(intimidat|threaten|menac|scare|bully|glare|loom over)/i],
  ['a Dexterity (Stealth) check',/\b(sneak|creep|hide\b|hiding|stealth|tiptoe|slip past|unnoticed|unseen|quietly|silently)/i],
  ['a Dexterity (Sleight of Hand) check',/\b(pick ?pocket|pick the lock|lockpick|palm\b|steal|swipe|pilfer|lift (his|her|their|the) (purse|key|coin))/i],
  ['a Strength (Athletics) check',/\b(climb|jump|leap|swim|shove|grapple|wrestle|force (it|the|open)|break down|lift\b|push (the|it|over)|haul|drag)/i],
  ['a Dexterity (Acrobatics) check',/\b(balance|tumble|dodge|flip|vault|somersault|roll under|swing across)/i],
  ['an Intelligence (Investigation) check',/\b(search|examin|inspect|investigat|look for (clues|traps|a)|rummage|study the)/i],
  ['a Wisdom (Perception) check',/\b(look around|listen|watch for|scan|keep (an eye|watch)|peer|spot\b|notice)/i],
  ['a Wisdom (Insight) check',/\b(is (he|she|they) lying|are they lying|read (him|her|them)|sense (his|her|their)|gauge|do i (trust|believe))/i],
  ['a Wisdom (Survival) check',/\b(track\b|tracks|follow the trail|forage|navigate|find (shelter|water|food|the way)|hunt\b)/i],
  ['a Wisdom (Medicine) check',/\b(bandage|treat (the|his|her|my|their) wound|stabili[sz]e|diagnos|tend to|bind (the|my) wound)/i],
  ['a Wisdom (Animal Handling) check',/\b(calm the|tame\b|soothe the|coax the|befriend the (horse|dog|wolf|beast|animal))/i],
  ['a Charisma (Performance) check',/\b(perform|sing\b|play (my|the) (lute|flute|drum|fiddle|song)|dance|juggle|tell a (tale|story) to)/i],
  ['an Intelligence (Arcana) check',/\b(arcane|decipher the (rune|glyph|sigil)|identify the (spell|magic)|what magic)/i],
  ['an Intelligence (History) check',/\b(recall|what do i know about|remember (the|any) (history|legend|tale)|history of)/i],
  ['an Intelligence (Nature) check',/\b(identify the (plant|animal|mushroom|beast|berr)|what kind of (plant|animal|tree))/i],
  ['an Intelligence (Religion) check',/\b(pray|what god|holy symbol|recogni[sz]e the (rite|ritual|shrine))/i],
];
const hintFor = t => (HINTS.find(([,re])=>re.test(t))||[])[0]||null;

/* ============ rolls ============ */
const pickD20 = (rolls,adv) => adv==='adv'?Math.max(...rolls):adv==='dis'?Math.min(...rolls):rolls[0];
const flare = pick => { if(pick===20) trayNode.classList.add('crit'); else if(pick===1) trayNode.classList.add('fumble'); };
async function resolvePending(adv){
  const c = cur, r = c.pendingRoll; if(!r||busy||rolling) return; const ch = c.character;
  let bonus = r.ability?mod(ch.abilities[r.ability]):0;
  if((r.skill&&ch.profs.includes(r.skill))||(r.save&&r.ability&&ch.saves.includes(r.ability))||r.proficient) bonus += prof(ch.level);
  rolling = true; const opened = await openTray();
  const two = adv==='adv'||adv==='dis', rolls = (await throwDice([{n:two?2:1,sides:20}]))[0], pick = pickD20(rolls,adv), total = pick+bonus; flare(pick);
  let t = `${r.label}: d20 rolled ${pick}${two?` (${rolls.join(' and ')}, ${adv==='adv'?'advantage':'disadvantage'})`:''} ${sgn(bonus)} = ${total}`;
  let hit = null;
  if(r.dc){ hit = r.damage?(pick===20||(pick!==1&&total>=r.dc)):total>=r.dc; t += ` vs ${r.damage?'AC':'DC'} ${r.dc}. ${hit?(r.damage?'Hit':'Success'):(r.damage?'Miss':'Failure')}`; }
  if(pick===20) t += ' (natural 20!)'; else if(pick===1) t += ' (natural 1)';
  t += '.';
  if(r.damage&&hit!==false){ const dm = rollExpr(r.damage,pick===20); await sleep(500);
    const dv = (await throwDice([{n:dm.rolls.length,sides:dm.sides}],true))[0], sum = Math.max(0,dv.reduce((a,x)=>a+x,0)+dm.bonus);
    t += ` Damage ${dm.text}: ${dv.join('+')}${dm.bonus?sgn(dm.bonus):''} = ${sum}.`; }
  pushTray(total,t); await sleep(1300); rolling = false; closeTray(opened);
  if(cur===c&&c.pendingRoll===r) takeTurn({role:'roll',text:t});
}
async function freeRoll(label,bonus,adv){
  if(rolling||!cur) return; rolling = true; const opened = await openTray();
  const rolls = (await throwDice([{n:1,sides:20}]))[0], pick = rolls[0], total = pick+bonus; flare(pick);
  const text = `${label}: d20 rolled ${pick} ${sgn(bonus)} = ${total}${pick===20?' (natural 20!)':pick===1?' (natural 1)':''}.`;
  pushTray(total,text); rolling = false; closeTray(opened);
}
function pushTray(total,text){ lastTray = {total,text}; trayHist.unshift(text); trayHist = trayHist.slice(0,12); if(cur&&tab==='dice') renderSide(); }
async function trayRoll(sides){
  if(rolling||!cur) return;
  const n = clamp(num($('#dN')?.value)||1,1,12), b = num($('#dB')?.value), adv = $('#dA')?.value||'none';
  const two = sides===20&&n===1&&adv!=='none'; rolling = true; trayNode.classList.remove('crit','fumble');
  const rolls = (await throwDice([{n:two?2:sides===100?1:n,sides}]))[0];
  const total = (two?pickD20(rolls,adv):rolls.reduce((a,x)=>a+x,0))+b, label = two?`d20 ${adv==='adv'?'advantage':'disadvantage'}`:`${rolls.length}d${sides}`;
  if(sides===20&&(two||rolls.length===1)) flare(two?pickD20(rolls,adv):rolls[0]);
  rolling = false; pushTray(total,`${label}${b?sgn(b):''}: ${rolls.join(', ')}${b?' '+sgn(b):''} = ${total}.`);
}

    case 'home': location.hash = ''; if(!location.hash) go(); break;
    case 'create': location.hash = 'new'; break;
    case 'open': if(cur&&cur.id===el.dataset.id&&!wide()) closeDrawers(); location.hash = el.dataset.id; break;
    case 'settings': openSettings(); break;
    case 'closeModal': closeModal(); break;
    case 'closeModalBg': if(ev.target===el) closeModal(); break;
    case 'toggleSide': drawer('right'); break;
    case 'toggleLeft': drawer('left'); break;
    case 'closeDrawers': closeDrawers(); break;
    case 'del': { const x = store.campaigns[el.dataset.id]; if(x&&confirm(`Delete "${x.title}"? This cannot be undone.`)){ delete store.campaigns[el.dataset.id]; store.deleted[el.dataset.id] = Date.now(); if(store.last===el.dataset.id) store.last = null; save(); renderHome(); } break; }
    case 'export': { const x = store.campaigns[el.dataset.id]; if(!x) break; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));
      a.download = x.title.replace(/[^\w-]+/g,'_')+'.emberglade.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); break; }
    case 'import': $('#importFile').click(); break;
    case 'randName': $('#createForm').name.value = NAMES[rnd(NAMES.length)-1]; break;
    case 'rollStats': fillStats(Array.from({length:6},()=>{ const d = [rnd(6),rnd(6),rnd(6),rnd(6)].sort((a,b)=>a-b); return d[1]+d[2]+d[3]; })); break;
    case 'stdArray': fillStats([15,14,13,12,10,8]); break;
    case 'tab': tab = el.dataset.tab; renderSide(); break;
    case 'sugg': if(!busy) playerAct(el.textContent); break;
    case 'pend': resolvePending(el.dataset.adv); break;
    case 'stop': if(aborter) aborter.abort(); break;
    case 'retry': takeTurn(null); break;
    case 'regen': regenerate(); break;
    case 'hp': c.character.hp = clamp(c.character.hp+num(el.dataset.d),0,c.character.maxHp); save(); renderSide(); break;
    case 'drop': c.character.inventory.splice(num(el.dataset.k),1); save(); renderSide(); break;
    case 'abil': freeRoll(ABIL_NAME[el.dataset.a]+' check',mod(c.character.abilities[el.dataset.a])); break;
    case 'save': freeRoll(ABIL_NAME[el.dataset.a]+' save',saveMod(c.character,el.dataset.a)); break;
    case 'skill': freeRoll(el.dataset.s+' check',skillMod(c.character,el.dataset.s)); break;
    case 'die': trayRoll(num(el.dataset.d)); break;
    case 'tellTray': if(lastTray&&!busy) takeTurn({role:'roll',text:lastTray.text}); break;
    case 'toastAct': { const t = $('#toast'); t.classList.remove('on'); if(t._action&&cur&&!busy) takeTurn({role:'roll',text:t._action.text}); break; }
    case 'memConnect': { readSettings(); saveLocal(); const out = $('#memout');
      if(!store.settings.memToken){ out.textContent = 'Paste a GitHub token first. "Create a token" opens the right page; keep only the gist box ticked.'; out.style.color = 'var(--danger)'; memLabel(); break; }
      await sync(); break; }
    case 'memOff': { Object.assign(store.settings,{memToken:'',gistId:'',lastSync:0}); memState = ''; saveLocal(); const f = $('#setForm'); if(f) f.memToken.value = '';
      memLabel(); const out = $('#memout'); if(out){ out.textContent = 'Disconnected. Tales stay in this browser, and the gist stays on your GitHub until you delete it.'; out.style.color = 'var(--muted)'; } break; }
    case 'loadModels': { readSettings(); const out = $('#testout'); out.textContent = 'Fetching models…'; out.style.color = 'var(--muted)';
      try{ const {url,headers} = endpoint('/models'); const r = await fetch(url,{headers}); if(!r.ok) throw new Error(r.status+' '+r.statusText); const j = await r.json();
        const ids = (j.data||j.models||[]).map(m=>m.id||m.name).filter(Boolean).sort(); $('#modelList').innerHTML = ids.map(i=>`<option value="${esc(i)}">`).join('');
        out.textContent = ids.length?`${ids.length} models loaded. Start typing in the model box to search.`:'The endpoint returned no models. Type the model id by hand.'; out.style.color = 'var(--good)';
      }catch(e){ out.textContent = 'Could not load the list ('+e.message+'). You can still type a model id by hand.'; out.style.color = 'var(--danger)'; } break; }
    case 'test': { readSettings(); const out = $('#testout'); out.textContent = 'Asking the narrator to clear their throat…'; out.style.color = 'var(--muted)';
      try{ const t = await chat([{role:'user',content:'Reply with the single word: ready'}],{stream:false,maxTokens:200,temperature:0}); out.textContent = 'Connected. The model answered: '+(t.trim().slice(0,80)||'(empty reply)'); out.style.color = 'var(--good)'; }
      catch(e){ out.textContent = e.message; out.style.color = 'var(--danger)'; } break; }
  }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault(); const f = ev.target;
  if(f.id==='sendForm'){ const t = $('#say').value.trim(); if(t&&!busy){ $('#say').value = ''; playerAct(t); } }
  else if(f.id==='setForm'){ readSettings(); save(); closeModal(); if(!cur) renderHome(); else if(!cur.log.length&&!busy) takeTurn(null); }
  else if(f.id==='addItem'){ const v = f.item.value.trim(); if(v){ cur.character.inventory.push({name:v,qty:1}); save(); renderSide(); } }
  else if(f.id==='createForm'){
    const boons = picked(f,'boons'), flaws = picked(f,'flaws');
    if(boons.length>flaws.length){ $('#createMsg').textContent = 'Every boon is paid for with a flaw. Pick another flaw, or give up a boon.'; return; }
    const abilities = {}; ABIL.forEach(a=>abilities[a]=f['ab_'+a].value);
    const character = newCharacter({name:f.name.value.trim(),race:f.race.value,cls:f.cls.value,background:f.background.value,alignment:f.alignment.value,
      appearance:f.appearance.value.trim(),backstory:f.backstory.value.trim(),abilities,boons,flaws});
    const id = 'c'+Date.now().toString(36)+rnd(1e6).toString(36);
    store.campaigns[id] = {id,title:`${character.name}'s tale`,created:Date.now(),updated:Date.now(),tone:'classic',character,
      premise:'Invent an original premise for this campaign, different from anything generic, and build it around this particular character: their background, backstory, boons, and flaws. Do not explain the premise up front; reveal it through the opening scene.',
      quests:[],location:'',summary:'',sumIdx:0,log:[],suggestions:[],pendingRoll:null};
    save(); location.hash = id;
  }
});
document.addEventListener('change',ev=>{
  const t = ev.target;
  if((t.name==='boons'||t.name==='flaws')&&t.form?.id==='createForm'){ if(picked(t.form,t.name).length>2) t.checked = false; showMods(); }
  if((t.name==='background')&&t.form?.id==='createForm') showMods();
  if(t.name==='cls'&&t.form?.id==='createForm') fillStats(ABIL.map(a=>num(t.form['ab_'+a].value)||10));
  if(t.name==='race'&&t.form?.id==='createForm') showMods();
  if(t.id==='importFile'&&t.files[0]){ t.files[0].text().then(txt=>{ const x = JSON.parse(txt); if(!x.character||!Array.isArray(x.log)) throw 0;
    x.id = 'c'+Date.now().toString(36)+rnd(1e6).toString(36); x.updated = Date.now(); x.quests ||= []; x.suggestions ||= []; store.campaigns[x.id] = x; saveLocal(); scheduleSync(); renderHome(); toast('✓','Tale imported.'); })
    .catch(()=>toast('!','That file is not an Emberglade save.')); }
});
document.addEventListener('input',ev=>{
  if(ev.target.name?.startsWith('ab_')) showMods();
  if(ev.target.id==='say'){ const t = ev.target; t.style.height = 'auto'; t.style.height = Math.min(160,t.scrollHeight+2)+'px'; }
});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='say'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ ev.preventDefault(); $('#sendForm').requestSubmit(); }
  if(ev.key==='Escape'){ if($('#modalRoot').firstChild) closeModal(); else if(!wide()&&$('#game')) closeDrawers(); }
});

matchMedia('(min-width:901px)').addEventListener('change',()=>{ if($('#game')){ setDrawer($('#leftD'),wide()&&!!store.ui.left); setDrawer($('#rightD'),wide()&&!!store.ui.right); } });
/* fireflies */
(function(){ const f = $('#flies'); for(let i=0;i<16;i++){ const s = document.createElement('i'); s.style.left = Math.random()*100+'%'; s.style.top = 25+Math.random()*75+'%';
  s.style.animationDelay = (-Math.random()*14)+'s'; s.style.animationDuration = 10+Math.random()*10+'s'; f.appendChild(s); } })();
go(); memLabel(); if(store.settings.memToken) sync();
</script>
</body>
</html>
