<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cali's Tavern">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Cali's Tavern — solo DnD, no bullshit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a centred chat column over a mood-tinted backdrop; two fold-away drawers (tales left, sheet right). */
:root{
  --bg:#0d1410;--solid:#111813;--text:#dfe3da;--muted:#98a394;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);
  --s1:rgba(255,255,255,.035);--s2:rgba(255,255,255,.07);--s3:rgba(255,255,255,.12);
  --ember:#d9a55a;--ember2:#ecc98c;--emberdeep:#a8742f;--danger:#d0614a;--good:#86b870;
  --display:"Cormorant Garamond",Georgia,serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--story:var(--ui);
  --r:14px;color-scheme:dark;
}
body[data-mood=night]{--bg:#090d18;--solid:#0d1322;--ember:#8fb0ee;--ember2:#bccff7;--emberdeep:#5574b8}
body[data-mood=hearth]{--bg:#16100c;--solid:#1b140f;--ember:#e9b27a;--ember2:#f5d3a8;--emberdeep:#a9713f}
body[data-mood=fire]{--bg:#140b09;--solid:#1a0f0c;--ember:#f08a4b;--ember2:#f8b98a;--emberdeep:#b84a22}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);font-size:15px;color:var(--text);background:var(--bg);overflow:hidden;transition:background-color 1.6s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* mood backdrops, cross-faded */
.bgl{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.8s ease;pointer-events:none}
#bg-forest{background:radial-gradient(1000px 520px at 50% -12%,rgba(150,190,120,.17),transparent 62%),radial-gradient(800px 600px at 0% 110%,rgba(60,120,80,.16),transparent 60%),linear-gradient(180deg,#111b15,#0b120e)}
#bg-night{background:radial-gradient(900px 520px at 70% -12%,rgba(120,150,230,.20),transparent 62%),radial-gradient(800px 600px at 0% 110%,rgba(50,70,150,.18),transparent 60%),linear-gradient(180deg,#0d1424,#070a13)}
#bg-hearth{background:radial-gradient(1000px 560px at 50% 108%,rgba(236,170,110,.22),transparent 62%),radial-gradient(700px 460px at 18% -10%,rgba(214,140,120,.12),transparent 60%),linear-gradient(180deg,#1b1410,#120d0a)}
#bg-fire{background:radial-gradient(1100px 560px at 50% 112%,rgba(240,110,50,.30),transparent 62%),radial-gradient(800px 480px at 50% -14%,rgba(200,60,40,.14),transparent 60%),linear-gradient(180deg,#1a0f0c,#110908)}
body[data-mood=forest] #bg-forest,body[data-mood=night] #bg-night,body[data-mood=fire] #bg-fire,body[data-mood=hearth] #bg-hearth{opacity:1}
#alarm{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(214,36,28,.62) 100%);display:grid;place-items:start center}
#alarm.on{animation:alarm 1.5s ease-out}
#alarm b{margin-top:calc(92px + env(safe-area-inset-top,0px));background:rgba(120,14,10,.92);border:1px solid #ff8a7a;color:#fff;border-radius:10px;padding:9px 18px;font:700 14px var(--ui);letter-spacing:.14em;text-transform:uppercase;max-width:88vw;text-align:center;box-shadow:0 10px 40px rgba(180,20,10,.6)}
@keyframes alarm{0%{opacity:0}10%{opacity:1}26%{opacity:.35}42%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#alarm{background:none}#alarm.on{animation:alarmcalm 2.2s linear!important}}
@keyframes alarmcalm{0%,100%{opacity:0}8%,85%{opacity:1}}
#flies{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;color:var(--ember2)}
#flies i{position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:0 0 9px 2px currentColor;opacity:0;animation:fly 14s ease-in-out infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}15%{opacity:.55}50%{opacity:.15;transform:translate(40px,-60px)}70%{opacity:.5}100%{opacity:0;transform:translate(-30px,-130px)}}
@media (prefers-reduced-motion:reduce){#flies{display:none}*{animation:none!important;transition:none!important}}

/* shell */
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
header.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ember2);background:none;border:0;padding:0}
.brand svg{width:22px;height:22px}
.bar .where{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.bar .where b{color:var(--text);font-weight:600}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--text);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px;transition:.15s background,.15s border-color}
.btn:hover{background:var(--s3);border-color:var(--ember)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ember);color:#17120a;border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--ember2)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.danger:hover{border-color:var(--danger);color:#ffb6a6}
.btn[aria-pressed=true]{border-color:var(--ember);color:var(--ember2)}
a.btn{text-decoration:none;display:inline-block}
:focus-visible{outline:2px solid var(--ember2);outline-offset:2px}
main{flex:1;min-height:0;overflow:auto}
.mem{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:none;white-space:nowrap}
.mem.ok{color:var(--good);border-color:rgba(134,184,112,.35)}
.mem.bad{color:#ffb6a6;border-color:var(--danger)}
.mem:hover{border-color:var(--ember)}
#memout,#testout{font-size:13px;min-height:18px}
#linkout{font-size:13px;color:var(--muted);line-height:1.5}
#linkout .qr{background:#fff;border-radius:12px;padding:8px;width:max-content;max-width:100%;margin:10px auto}
#linkout .qr svg{display:block;width:min(240px,100%);height:auto}
#linkout input{margin-top:6px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}

/* home + forms */
.wrap{max-width:940px;margin:0 auto;padding:36px 20px 60px}
.hero{text-align:center;padding:24px 0 30px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(42px,8vw,68px);margin:0;line-height:1;color:var(--text)}
.hero p{font-size:16px;color:var(--muted);max-width:520px;margin:14px auto 24px;line-height:1.6}
.notice{border:1px dashed var(--line2);background:var(--s1);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 24px;color:var(--ember2);flex-wrap:wrap}
h2.sec{font-family:var(--display);font-size:26px;font-weight:600;margin:28px 0 12px}
.saves{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.save{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.save h3{margin:0;font-family:var(--display);font-size:22px;color:var(--ember2)}
.save .meta{color:var(--muted);font-size:13px}
.save .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.panel{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:20px;margin-bottom:14px}
.panel h3{margin:0 0 14px;font-family:var(--display);font-size:22px;color:var(--ember2);font-weight:600}
.panel h3 small{font:500 13px var(--ui);margin-left:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;color:var(--text);font-size:15px;letter-spacing:0;text-transform:none;width:100%}
.inp:focus{border-color:var(--ember);outline:none}
select.inp option{background:var(--solid)}
textarea.inp{resize:vertical;min-height:80px}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.abil label{align-items:center;text-align:center}
.abil input{text-align:center;font-size:20px;font-family:var(--display);font-weight:700;padding:6px 2px}
.abil small{color:var(--ember2);letter-spacing:0;font-size:13px}
.hooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.hook{position:relative;border:1px solid var(--line);border-radius:12px;padding:13px;background:rgba(0,0,0,.18);cursor:pointer;display:block}
.hook input{position:absolute;opacity:0}
.hook b{display:block;font-family:var(--display);font-size:19px;margin-bottom:3px}
.hook span{color:var(--muted);font-size:13.5px;line-height:1.45}
.hook:has(input:checked){border-color:var(--ember);background:var(--s2);box-shadow:0 0 0 1px var(--ember) inset}
.hook:has(input:focus-visible){outline:2px solid var(--ember2)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;line-height:1.5}

/* game: drawers + chat */
#game{height:100%;display:flex;min-width:0}
.drawer{flex:none;width:0;overflow:hidden;transition:width .25s ease}
.drawer.open{width:310px}
.drawer>div{width:310px;height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#leftD{border-right:1px solid transparent}#leftD.open{border-right-color:var(--line)}
#rightD{border-left:1px solid transparent}#rightD.open{border-left-color:var(--line)}
#leftD.open,#rightD.open{background:rgba(0,0,0,.16)}
.tale{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 11px}
.tale:hover{background:var(--s2)}
.tale.on{background:var(--s2);border-color:var(--line2)}
.tale b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tale span{font-size:12px;color:var(--muted)}
.dlabel{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 4px 0}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
#log{flex:1;min-height:0;overflow:auto;padding:28px 18px 10px;font-size:16px;line-height:1.72;scroll-behavior:smooth}
.e{max-width:760px;margin:0 auto 22px}
.e p{margin:0 0 .85em}.e p:last-child{margin-bottom:0}
.e .lbl{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ember);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.e .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ember)}
.e.dm strong{color:#fff;font-weight:600}
.e.player{display:flex;justify-content:flex-end}
.e.player .bub{background:var(--s3);border-radius:18px 18px 5px 18px;padding:10px 16px;max-width:82%}
.e.roll{display:flex;justify-content:center}
.e.roll .bub{font-size:13.5px;line-height:1.45;background:var(--s1);border:1px solid var(--line2);color:var(--muted);border-radius:16px;padding:6px 14px;display:flex;gap:9px;align-items:center}
.e.roll svg{width:16px;height:16px;flex:none;color:var(--ember2)}
.e.err{font-size:14px;background:rgba(208,97,74,.14);border:1px solid rgba(208,97,74,.45);color:#ffd9cf;border-radius:12px;padding:10px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chg span{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--s2);color:var(--muted);border:1px solid var(--line)}
.chg .bad{color:#ffb6a6;border-color:rgba(208,97,74,.45)}
.chg .ok{color:var(--good);border-color:rgba(134,184,112,.35)}
.chg .up,.chg .down{letter-spacing:.02em}
.chg .up{color:#8fd18a;border-color:rgba(143,209,138,.45);background:rgba(143,209,138,.1)}
.chg .down{color:#f0796a;border-color:rgba(240,121,106,.5);background:rgba(240,121,106,.1)}
.arw{font-size:.82em;letter-spacing:.06em;margin-left:5px}
#relbar{position:fixed;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));z-index:24;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
#relbar div{background:var(--solid);border:1px solid var(--line2);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:relin 3.6s ease forwards;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#relbar .up{color:#8fd18a;border-color:rgba(143,209,138,.55)}#relbar .down{color:#f0796a;border-color:rgba(240,121,106,.6)}
@keyframes relin{0%{opacity:0;transform:translateY(-10px)}8%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.bondbar{display:flex;align-items:center;gap:8px}
.bondbar i{flex:1;height:6px;border-radius:99px;background:linear-gradient(90deg,#f0796a,rgba(255,255,255,.14) 50%,#8fd18a);position:relative;display:block}
.bondbar i::after{content:"";position:absolute;top:-3px;left:calc(var(--p) - 2px);width:4px;height:12px;border-radius:2px;background:var(--text)}
.e[data-i]{cursor:pointer;border-radius:12px;transition:background .15s}
.e.sel{background:var(--s1);box-shadow:0 0 0 8px var(--s1)}
.e.player.sel,.e.roll.sel,.e.note.sel{flex-wrap:wrap}
.etools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;flex-basis:100%;cursor:default}
.e.player .etools{justify-content:flex-end}.e.roll .etools,.e.note .etools{justify-content:center}
.etools button{font-size:12.5px;border:1px solid var(--line2);background:var(--s2);color:var(--text);border-radius:99px;padding:5px 12px;min-height:32px}
.etools button:hover{border-color:var(--ember)}
.etools button.warn:hover{border-color:var(--danger);color:#ffb6a6}
.eedit{flex-basis:100%;width:100%;cursor:default}
.eedit textarea{min-height:120px;font-size:15px;line-height:1.55}
.tools{margin-top:8px}
.tools button{font-size:12px;background:none;border:0;color:var(--muted);padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.tools button:hover{color:var(--ember2)}
.cursor::after{content:"";display:inline-block;width:.5em;height:1em;background:var(--ember);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{color:var(--muted)}
.composer{max-width:796px;width:100%;margin:0 auto;padding:6px 18px 18px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sugg button{font-size:13.5px;text-align:left;border:1px solid var(--line2);background:var(--s1);color:var(--text);border-radius:99px;padding:6px 13px}
.sugg button:hover{background:var(--s3);border-color:var(--ember)}
.rollcard{background:var(--s2);border:1px solid var(--ember);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rollcard .t{flex:1;min-width:200px}
.rollcard .t b{font-family:var(--display);font-size:20px;color:var(--ember2)}
.rollcard .t div{font-size:13px;color:var(--muted)}
.send{display:flex;gap:8px;align-items:flex-end;background:var(--s2);border:1px solid var(--line2);border-radius:24px;padding:7px 7px 7px 18px}
.send:focus-within{border-color:var(--ember)}
.send textarea{flex:1;border:0;background:none;color:var(--text);padding:8px 0;font-size:16px;line-height:1.45;resize:none;min-height:38px;max-height:160px;outline:none}
.send textarea::placeholder{color:var(--muted)}
.send .btn{width:38px;height:38px;padding:0;border-radius:50%;font-size:17px;flex:none}
.send .btn svg{width:19px;height:19px;display:block;margin:auto}

/* sheet */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:rgba(0,0,0,.3);padding:4px;border-radius:12px;border:1px solid var(--line);position:sticky;top:0;z-index:2;backdrop-filter:blur(8px)}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 1px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--s3);color:var(--ember2)}
.card{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:14px}
.card h4{margin:0 0 10px;font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.who h3{margin:0;font-family:var(--display);font-size:25px;line-height:1.1}
.who .sub{color:var(--muted);font-size:13px;margin-top:3px}
.vitals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.vital{background:rgba(0,0,0,.25);border-radius:10px;padding:8px;text-align:center;border:1px solid var(--line)}
.vital b{display:block;font-family:var(--display);font-size:23px;line-height:1.1}
.vital span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hpbar{height:7px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:12px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#b5452f,#d9a55a 55%,#86b870);transition:width .4s}
.hprow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted)}
.hprow .btn{padding:1px 9px}
.xp{font-size:12px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;color:inherit}
.stat:hover,.skill:hover{border-color:var(--ember);background:var(--s2)}
.stat span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.05}
.stat small{color:var(--ember2);font-size:12px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.skill{display:flex;justify-content:space-between;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 7px;font-size:13px;text-align:left;color:var(--text)}
.skill.prof{color:var(--ember2)}
.skill.prof::before{content:"◆";font-size:8px;margin-right:4px;align-self:center}
.skill span{flex:1}.skill em{font-style:normal;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(208,97,74,.16);border:1px solid rgba(208,97,74,.4);color:#ffc1b3}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.22);font-size:14px}
ul.list li span{flex:1}ul.list li em{font-style:normal;color:var(--muted);font-size:13px}
ul.list li button{background:none;border:0;color:var(--muted);padding:0 4px;font-size:16px;line-height:1}
ul.list li button:hover{color:var(--danger)}
.addrow{display:flex;gap:6px;margin-top:10px}
.quest{padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.22);border-left:3px solid var(--ember);margin-bottom:8px}
.quest b{display:block;font-family:var(--display);font-size:18px}
.quest span{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.quest.done{border-color:var(--good);opacity:.7}.quest.done b{text-decoration:line-through}
.quest.failed{border-color:var(--danger);opacity:.7}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.die{aspect-ratio:1;border:1px solid var(--line2);border-radius:12px;background:var(--s2);font-family:var(--display);font-weight:700;font-size:19px}

async function roll3d(groups,keep,apart){

async function throwDice(groups,keep,apart){

      try{ box.resizeWorld(); vals = await roll3d(groups,keep&&tries===0,apart||tries>0); }
      catch(e){ vals = null;

        if(rebuilds++<4){ box = null; boxState = ''; $('#tray3d').innerHTML = ''; await boxInit(); } else break; } }
  }
  if(!vals){
    if(box){ try{ box.clear(); }catch(e){} }
    $('#tray3d').style.visibility = 'hidden';
    vals = groups.map(g=>Array.from({length:g.sides===100?1:g.n},()=>rnd(g.sides)));

- When an app note tells you the player's action needs a particular check, narrate only the attempt up to the moment of uncertainty, in two or three sentences, and end your reply by telling the player plainly what to roll, for example: "Roll Persuasion." Do not narrate the outcome yet. Whenever you ask for a roll yourself, end on that same kind of line.
- Every d20 result arrives with a degree, and the outcome must be scaled to it. The middle degrees are ordinary: narrow, clean, fair. The ends are extreme. A natural 20 is the power of the dice: the attempt comes off spectacularly even if it was a long shot, more is gained than was asked for, and anyone on the other side of it is swayed, impressed or won over beyond what reason would allow. A natural 1 is the mirror of that: the worst plausible turn, with lasting cost. Never flatten a 20 into an ordinary success or a 1 into an ordinary failure, and never let your own sense of what is likely overrule the degree.
- The degree line already weighs the natural die, how far the total landed from the target, and how lopsided that gap was, so follow its wording closely. When it says a result goes further still, it means it: an easy target met with a natural 20 is far more than a win, and a hard one met with a natural 1 is far more than a loss.

const npcLine = n => `- ${n.name}: ${n.about||'not yet described'}. Traits: ${(n.traits||[]).join(', ')||'none noted yet'}. Skills: ${(n.skills||[]).join(', ')||'none noted'}. Wants: ${n.wants||'unclear'}. Stance toward the player character: ${stanceOf(n)} (${n.attitude||'neutral'}).${(n.memory||[]).length?' Remembers: '+n.memory.map(m=>m.t).join(' / ')+'.':''}`;

function jsonIn(t){
  t = String(t||'').replace(/```(?:json)?/gi,''); const a = t.indexOf('{'); if(a<0) return null; t = t.slice(a);
  const tryParse = x => { try{ return JSON.parse(x); }catch(e){ try{ return JSON.parse(x.replace(/,\s*([}\]])/g,'$1')); }catch(e2){ return undefined; } } };
  const b = t.lastIndexOf('}'); if(b>0){ const v = tryParse(t.slice(0,b+1)); if(v!==undefined) return v; }
  // Cut off mid-reply: walk the text, remember each point where a value had just finished, and close the brackets from the last good one.
  const stack = [], cuts = []; let str = false, escp = false;
  for(let k=0;k<t.length;k++){ const ch = t[k];
    if(str){ if(escp) escp = false; else if(ch==='\\') escp = true; else if(ch==='"') str = false; continue; }
    if(ch==='"') str = true; else if(ch==='{'||ch==='[') stack.push(ch); else if(ch==='}'||ch===']'){ stack.pop(); if(!stack.length) break; }
    else if(ch===',') cuts.push([k,stack.slice()]); }
  for(let n=cuts.length-1;n>=0&&n>=cuts.length-6;n--){ const [k,st] = cuts[n], v = tryParse(t.slice(0,k)+st.reverse().map(c=>c==='{'?'}':']').join('')); if(v!==undefined&&v&&typeof v==='object') return v; }

}

OK

let denied = null;
async function guard(c,text,signal){
  if(!store.settings.useGuard) return null;
  const ch = c.character, dm = lastOf(c,'dm'); let out = '';
  try{
    out = await chat([{role:'system',content:GUARD},{role:'user',content:`Facts: at ${c.location||'an unnamed place'}. With: ${(c.present||[]).join(', ')||'no one'}. ${ch.name}, level ${ch.level} ${ch.race} ${ch.cls}, ${ch.hp}/${ch.maxHp} HP, ${ch.gold} gp. Carries: ${ch.inventory.map(i=>i.name).join(', ')||'nothing'}. Class features: ${ch.features}.
Scene: ${dm?clip(dm.text,600):'the adventure is just beginning'}
Action: ${text}${postHistory(c)?'\n\n'+postHistory(c):''}`}],{stream:false,maxTokens:1200,temperature:0,model:store.settings.checkModel,quick:true,signal});
  }catch(e){ if(e.name==='AbortError') throw e; return null; }
  const line = (out.trim().split('\n').filter(x=>/^\W*(ok|no)\b/i.test(x)).pop()||'').trim();
  if(!/^\W*no\b/i.test(line)) return null;
  const parts = line.split('|').map(x=>x.trim()).filter(Boolean);
  return {reason:(parts[1]||'That skips past what is happening right now.').slice(0,140),steps:parts.slice(2,5).map(x=>x.replace(/^[-\d.)\s]+/,'').slice(0,90)).filter(Boolean)};
}
// The narrator often names someone without recording them. This small pass reads the scene and records whoever was missed.
const SPOT = `You pick out the people in a passage from a fantasy story. List every individual person or creature that the passage calls by a proper name or by a fixed title used like a name (for example "Marta Quill", "the Ninth Borrower", "the tally-clerk"), including people who are only talked about, who is NOT already in the known list. Never list someone who is only described in passing and has no name or title, such as "a woman with her hood up", "two carters" or "the man by the door"; a name is one to four words and is never a description. If the passage gives a known person a new name or title, list that person again using their known name, with the new name in the last field. Do not list places, objects, groups, crowds, or the player character.
Reply with one line per person and nothing else, or the single word NONE:
Name|who they are, in a few words|friendly, neutral, wary, hostile or strange (toward the player character)|other names or titles used for them, comma separated`;
async function spotNames(c,text){
  if(!text||text.length<40) return false; let out = '';
  try{
    out = await chat([{role:'system',content:SPOT},{role:'user',content:`Player character (never list): ${c.character.name}\nKnown: ${Object.values(c.npcs||{}).map(n=>n.name+((n.aka||[]).length?' (also '+n.aka.join(', ')+')':'')).join('; ')||'no one yet'}\n\nPassage:\n${clip(text,2400)}`}],
      {stream:false,maxTokens:1200,temperature:0,model:store.settings.gateModel,quick:true});
  }catch(e){ return false; }
  c.npcs ||= {}; let changed = false; const pc = c.character.name.toLowerCase();
  const find = name => Object.values(c.npcs).find(n=>n.name.toLowerCase()===name.toLowerCase()||(n.aka||[]).some(a=>a.toLowerCase()===name.toLowerCase()));
  for(const line of out.split('\n')){ const f = line.replace(/^[\s\-*\d.)]+/,'').split('|').map(x=>x.trim()); const name = (f[0]||'').replace(/^["']|["']$/g,'').slice(0,50);
    if(f.length<2||name.length<2||!okName(name)||/^none$/i.test(name)||name.toLowerCase()===pc||pc.split(/\s+/).includes(name.toLowerCase())) continue;
    let sh = find(name); const before = sh?(sh.aka||[]).length:0;
    if(!sh){ if(Object.keys(c.npcs).length>=40) continue; sh = c.npcs[name] = {name,about:(f[1]||'').slice(0,240),traits:[],skills:[],wants:'',attitude:'neutral',memory:[]}; if(STANCES.includes((f[2]||'').toLowerCase())) sh.stance = f[2].toLowerCase(); changed = true; }
    else if(!sh.about&&f[1]) { sh.about = f[1].slice(0,240); changed = true; }
    addAka(c,sh,f[3]); if((sh.aka||[]).length!==before) changed = true; }
  return changed;
}
// Reads the whole sheet, not a summary, and says whether the character has what an action needs. Its yes is passed to the DM as fact.
const REFEREE = `You are the rules referee for a solo D&D 5e style game. You are given the character's complete sheet and what the player wants to do. Decide one thing only: does the character have what the action needs? That means the item, the weapon, the spell or class feature, the skill, the ability, or a free hand.
Be generous and literal. If the sheet lists it, the answer is YES. If a character of this race, class and level would plainly have it (a bard can cast bard spells and perform, a ranger can track, anyone can talk, run, climb, search or swing a fist), the answer is YES. Being unlikely to succeed is never a NO: that is what the dice are for. Only answer NO when the action depends on a specific thing that the sheet clearly does not have.
Reply with ONE line and nothing else:
YES|what on the sheet supports it, in under fifteen words
NO|what is missing, in under fifteen words
NA
Use NA when the action needs nothing in particular.`;
async function sheetCheck(c,text,signal){
  if(!store.settings.useSheet) return null; let out = '';
  try{ out = await chat([{role:'system',content:REFEREE},{role:'user',content:`# Sheet\n${sheetText(c)}\n\n# The player wants to\n${text}`}],{stream:false,maxTokens:1200,temperature:0,model:store.settings.sheetModel,quick:true,signal}); }
  catch(e){ if(e.name==='AbortError') throw e; return null; }
  const line = (out.trim().split('\n').filter(x=>/^\W*(yes|no|na)\b/i.test(x)).pop()||'').trim(), fact = (line.split('|')[1]||'').trim().replace(/[.\s]+$/,'').slice(0,160);
  return /^\W*yes\b/i.test(line)?{ok:true,fact}:/^\W*no\b/i.test(line)?{ok:false,fact}:null;
}
const needKey = () => { const s = store.settings; if(!s.apiKey&&/openrouter\.ai/i.test(s.baseUrl)){ openSettings('Add your OpenRouter API key first, so the narrator has a voice.'); return true; } return false; };
// A player's action goes to the dice gate first. A yes puts the roll card up and waits; a no goes straight to the story.
async function playerAct(text,trusted,overrule,rollNow){
  if(busy||!cur||needKey()) return;
  const c = cur, entry = {role:'player',text}; c.log.push(entry); denied = null;
  c.suggestions = []; c.pendingRoll = null; lastErr = null; busy = true; aborter = new AbortController(); save(); renderGame();
  setLive(trusted||!store.settings.useGuard?'Asking whether the dice are needed…':'Checking this against the scene…');
  let g = {ask:false,roll:null}, no = null, sheet = null, stopped = false;
  try{ [g,no,sheet] = await Promise.all([rollNow?{ask:false,roll:null}:gate(c,text,aborter.signal),trusted||c.god?null:guard(c,text,aborter.signal),trusted||c.god?null:sheetCheck(c,text,aborter.signal)]); }catch(e){ stopped = true; }
  busy = false; aborter = null; if(cur!==c) return;
  const drop = () => { const k = c.log.indexOf(entry); if(k>=0) c.log.splice(k,1); };
  if(stopped||(no&&!g.ask)){ drop(); if(no) denied = {...no,text}; save(); renderGame(); const ta = $('#say'); if(ta&&!ta.value) ta.value = text; return; }
  if(g.ask){ drop(); if(g.roll){ c.pendingRoll = {...g.roll,ask:text}; save(); renderGame(); return; }
    let run = 0; for(let i=c.log.length-1;i>=0&&c.log[i].role==='aside';i--) run++;
    if(run>=DM_PULL-1){ enterDm(c,true); dmSay(text,true); return; }
    save(); answerAside(c,text,null); return; }
  // The sheet check found something missing: stop, say what, and let the player overrule it.
  if(sheet&&sheet.ok===false){ drop(); denied = {title:'Not on your sheet.',reason:(sheet.fact?sheet.fact[0].toUpperCase()+sheet.fact.slice(1)+'.':'Your character does not seem to have what this needs.'),steps:[],text,force:true}; save(); renderGame(); const ta = $('#say'); if(ta&&!ta.value) ta.value = text; return; }
  if(overrule) entry.sheet = 'The player has checked their own sheet and overruled the app: the character is able to attempt this.';
  else if(sheet&&sheet.ok) entry.sheet = `The character can do this${sheet.fact?': '+sheet.fact:''}.`;
  // The player chose to roll for this themselves: throw a d20 now, with the bonus for whichever skill the action plainly leans on, and send both on.
  if(rollNow){ const m = /\(([^)]+)\)/.exec(hintFor(text)||''), skill = m&&Object.keys(SKILLS).find(k=>k===m[1]);
    c.pendingRoll = {label:skill?skill+' check':'d20',ability:skill?SKILLS[skill]:null,skill:skill||null,save:false,proficient:false,advantage:'none',dc:null,damage:null,own:true};
    save(); renderGame(); resolvePending('none'); return; }
  if(g.roll&&!store.settings.announce){ c.pendingRoll = g.roll; save(); renderGame(); return; }
  if(g.roll) entry.callRoll = g.roll; else entry.noRoll = true; takeTurn(null);
}

async function takeTurn(entry){
  if(busy||!cur||needKey()) return;
  const c = cur, s = store.settings;
  if(entry) c.log.push(entry);
  c.suggestions = []; c.pendingRoll = null; lastErr = null; busy = true; aborter = new AbortController();
  save(); renderGame();
  const signal = aborter.signal; let shifts = [], rels = [];
  let raw = '', raf = 0, text = '', state = {}, fixed = false, checked = false, live = setLive(`${dmName()} is thinking…`);
  try{
    let intents = [];
    const who = (c.present||[]).filter(n=>c.npcs&&c.npcs[n]).slice(0,3);
    const setup = lastOf(c,'player'), calling = setup&&setup===c.log[c.log.length-1]&&setup.callRoll;
    const fight = c.mood==='fire';
    if(who.length&&c.log.length&&!calling&&!fight){ live = setLive(`${who.join(', ').replace(/, ([^,]*)$/,' and $1')} ${who.length>1?'weigh':'weighs'} what to do…`); intents = await castBeat(c,signal); shifts = intents.filter(x=>x.shift); live = setLive(`${dmName()} is thinking…`); }
    let ended = ''; const msgs = buildMessages(c,intents);
    raw = await chat(msgs,{signal,onEnd:f=>{ ended = f; },onText:t=>{ raw = t; if(raf) return; raf = requestAnimationFrame(()=>{ raf = 0; const v = visibleText(raw); if(v){ live.innerHTML = lblDM()+md(v); live.lastElementChild?.classList.add('cursor'); scrollLog(); } }); }});
    cancelAnimationFrame(raf); raf = 0;
    // Ran out of room before the state block: have it pick up exactly where it stopped.
    if(ended==='length'&&raw.trim()&&!/<state\b/i.test(raw)){ live.lastElementChild?.classList.remove('cursor');
      const more = await chat([...msgs,{role:'assistant',content:raw},{role:'user',content:'[App note: your reply was cut off. Continue from exactly where it stopped, without repeating anything, finish the thought in a sentence or two, then give the state block.]'}],{stream:false,signal,maxTokens:Math.max(6000,Number(s.maxTokens)),quick:true}).catch(e=>{ if(e.name==='AbortError') throw e; return ''; });
      raw = raw.replace(/\s+$/,'')+(/^[\s<,.;:!?)]/.test(more)?'':' ')+more; }
    ({text,state} = parseReply(raw));
    if(text&&s.useCheck&&c.log.length&&!calling&&!fight){
      live.innerHTML = lblDM()+md(text)+'<div class="tools thinking">…</div>'; scrollLog();
      const f = await continuity(c,text,state,intents,signal); checked = true; if(f){ text = f.text; state = f.state; fixed = true; }
    }
  }catch(e){ if(e.name!=='AbortError'){ lastErr = e.message||String(e); text = ''; } else if(!text) ({text,state} = parseReply(raw)); }
  cancelAnimationFrame(raf); busy = false; aborter = null;
  if(cur!==c) return;
  if(text){
    const pre = snapshot(c);
    { let kept = 0; for(let k=c.log.length-1;k>=0;k--) if(c.log[k].pre&&++kept>=KEEP_UNDO) delete c.log[k].pre; }
    const called = c.log[c.log.length-1]; c._acted = shifts.map(x=>x.name); const changes = applyState(c,state); delete c._acted;
    for(const x of shifts){ const n = c.npcs&&c.npcs[x.name], r0 = n&&shiftBond(n,x.shift); if(r0) changes.push({...r0,rel:1}); }
    rels = changes.filter(x=>x.rel);
    if(called&&called.role==='player'&&called.callRoll){ c.pendingRoll = called.callRoll; c.suggestions = []; }
    const says = store.settings.dmTalk&&typeof state.dm_says==='string'?state.dm_says.trim().slice(0,220):'';
    c.log.push({role:'dm',text,state,changes,pre,...(checked?{ok:1}:{}),...(says?{says}:{})});
    c.updated = Date.now();
  }else if(!lastErr&&!signal.aborted) lastErr = raw?'The model replied with no narration. Try again, or pick a different model.':'The model returned an empty reply. Try again, raise max tokens in Models, or pick a different model.';
  save(); renderGame(); relPop(rels); if(c._alarm){ alarm(c._alarm==='A fight breaks out'?c._alarm:'Encounter: '+c._alarm); delete c._alarm; } if(text) summarize(c);
  if(text&&!signal.aborted) spotNames(c,text).then(ch=>{ if(!ch) return; save(); if(cur===c){ renderLog(); if(tab==='people') renderSide(); } });
}
// Each scene keeps a snapshot of the sheet and the world from just before it, for the most recent scenes, so a scene can be redone with everything put back.
const KEEP_UNDO = 15;
// The player changed something by hand in Settings or the item editor. Write that into the saved snapshots too, so redoing a scene does not undo the edit.
function rebase(c,keys){ for(const e of c.log){ if(!e.pre) continue; try{ const snap = JSON.parse(e.pre); for(const k of keys) snap[k] = c[k]; e.pre = JSON.stringify(snap); }catch(err){} } }
let selEntry = -1, editEntry = -1;
// Cuts the tale back to just before entry i. Restores the sheet and the world if a snapshot from that point survives; says whether it did.
function rewindTo(c,i){
  let j = i; while(j<c.log.length&&c.log[j].role!=='dm') j++;
  const snap = c.log[j]&&c.log[j].pre; if(snap) Object.assign(c,JSON.parse(snap));
  c.log.length = i; c.sumIdx = Math.min(c.sumIdx||0,i); c.pendingRoll = null; c.suggestions = []; denied = null; lastErr = null; selEntry = editEntry = -1;
  return !!snap;
}
function redoEntry(i){
  const c = cur, e = c&&c.log[i]; if(!e||busy||rolling) return;
  if(e.role==='aside'){ c.log.splice(i,1); selEntry = -1; save(); answerAside(c,e.q,e.roll||null); return; }
  if(e.role!=='dm'&&e.role!=='player') return;
  const after = c.log.length-1-i, hasSnap = (()=>{ let j = i; while(j<c.log.length&&c.log[j].role!=='dm') j++; return !!(c.log[j]&&c.log[j].pre); })();
  if(after>0&&!confirm(`Redo from here? The ${after} ${after===1?'entry':'entries'} after this one will be removed${hasSnap?', and your sheet and the world go back to how they were at this point.':'. This scene is too far back for the sheet to be put back, so hit points, items and people stay as they are now.'}`)) return;
  const text = e.text; rewindTo(c,i); save();
  if(e.role==='player') playerAct(text); else takeTurn(null);
}
function regenerate(){ if(cur&&cur.log.length) redoEntry(cur.log.length-1); }
async function summarize(c){
  const from = c.sumIdx||0; if(c.log.length-from<34||c._summing) return;
  c._summing = true; const take = c.log.slice(from,from+18);
  const script = take.map(e=>e.role==='dm'?'DM: '+e.text:e.role==='player'?'PLAYER: '+e.text:e.role==='aside'?`ASIDE: ${e.q} / ${e.a}`:e.role==='note'?'NOTE: '+e.text:'DICE: '+e.text).join('\n\n');
  try{
    const t = await chat([{role:'system',content:'You keep the running record of a solo fantasy tabletop campaign. Merge the existing summary with the new transcript into one updated summary of at most 250 words. Keep names, places, promises, debts, enemies, unresolved threads, and important choices. Plain prose, past tense, no preamble.'},
      {role:'user',content:`Existing summary:\n${c.summary||'(none)'}\n\nNew transcript:\n${script}`}],{stream:false,maxTokens:500,temperature:0.3});
    if(t&&t.trim()){ c.summary = t.trim(); c.sumIdx = from+take.length; save(); }
  }catch(e){}
  delete c._summing;
}

/* ============ memory: cloud sync to a secret GitHub gist ============ */
const GH = 'https://api.github.com', MEMFILE = 'calis-tavern-memory.json', OLDFILE = 'emberglade-memory.json';
let syncT = 0, syncing = false, syncAgain = false, memState = '', memErr = '', lastTry = 0;
function memLabel(){
  const s = store.settings, el = $('#mem'); if(!el) return;
  el.textContent = !s.memToken?'Saved on this device':memState==='sync'?'Syncing…':memState==='err'?'Memory sync failed':s.lastSync?'Memory synced '+new Date(s.lastSync).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Memory connected';
  el.className = 'mem'+(memState==='err'?' bad':s.memToken?' ok':'');
  const out = $('#memout'); if(out&&s.memToken){ out.style.color = memState==='err'?'var(--danger)':memState==='sync'?'var(--muted)':'var(--good)';
    out.textContent = memState==='err'?memErr:memState==='sync'?'Talking to GitHub…':s.lastSync?`Connected. ${Object.keys(store.campaigns).length} tale(s) held in memory.`:''; }
}
async function gh(path,opt={}){
  let r; try{ r = await fetch(GH+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+store.settings.memToken,...(opt.body?{'Content-Type':'application/json'}:{})}}); }
  catch(e){ throw new Error('Could not reach GitHub. Check your connection.'); }
  if(!r.ok){ const e = new Error(r.status===401?'GitHub rejected the token. Make a new one with the gist permission.':r.status===403?'GitHub refused (403). The token needs the gist permission.':'GitHub answered '+r.status+'.'); e.status = r.status; throw e; }
  return r.json();
}
const PREFS = ['baseUrl','model','gateModel','charModel','checkModel','forgeModel','sheetModel','useSheet','useCheck','useGuard','dmPick','dmName','dmVoice','dmCalls','dmTalk','announce','encumb','vulgar','lore','loreSize','diff','len','voice','trouble','temperature','maxTokens','stream'];
const memCore = o => JSON.stringify([o.last||null,o.deleted||{},o.campaigns||{},o.prefs||null,o.prefsAt||0,o.lore||null,o.loreAt||0]);
function memData(){ const campaigns = {}; for(const [id,c] of Object.entries(store.campaigns)){ const {_summing,_lore,_acted,_alarm,...rest} = c; campaigns[id] = rest; }
  return {app:'calis-tavern',version:1,savedAt:Date.now(),last:store.last||null,deleted:store.deleted,campaigns,prefs:Object.fromEntries(PREFS.map(k=>[k,store.settings[k]])),prefsAt:store.prefsAt||0,lore:store.lore,loreAt:store.loreAt||0}; }
function mergeRemote(r){
  let changed = false;
  for(const [id,ts] of Object.entries(r.deleted||{})) if(typeof ts==='number'&&!(store.deleted[id]>=ts)) store.deleted[id] = ts;
  for(const [id,rc] of Object.entries(r.campaigns||{})){
    if(!rc||!rc.character||!Array.isArray(rc.log)||store.deleted[id]>=(rc.updated||0)) continue;
    const lc = store.campaigns[id];
    if(lc&&(lc.updated||0)>=(rc.updated||0)) continue;
    if(cur&&cur.id===id&&busy) continue;
    rc.id = id; rc.quests ||= []; rc.suggestions ||= []; store.campaigns[id] = rc; changed = true;
    if(cur&&cur.id===id){ cur = rc; renderGame(); }
  }
  for(const id of Object.keys(store.campaigns)) if(store.deleted[id]>=(store.campaigns[id].updated||0)&&!(cur&&cur.id===id)){ delete store.campaigns[id]; changed = true; }
  if(r.last&&!store.last&&store.campaigns[r.last]){ store.last = r.last; changed = true; }
  if(r.lore&&typeof r.lore==='object'&&(r.loreAt||0)>(store.loreAt||0)){ store.lore = {off:r.lore.off||{},books:Array.isArray(r.lore.books)?r.lore.books:[]}; store.loreAt = r.loreAt; changed = true; }
  if(r.prefs&&typeof r.prefs==='object'&&(r.prefsAt||0)>(store.prefsAt||0)){ for(const k of PREFS) if(k in r.prefs&&typeof r.prefs[k]===typeof DEFAULTS[k]) store.settings[k] = r.prefs[k]; store.prefsAt = r.prefsAt; changed = true; }
  return changed;
}
function scheduleSync(){ if(!store.settings.memToken) return; clearTimeout(syncT); syncT = setTimeout(sync,4000); }
async function sync(){
  const s = store.settings; if(!s.memToken) return;
  if(syncing){ syncAgain = true; return; }
  clearTimeout(syncT); syncing = true; lastTry = Date.now(); memState = 'sync'; memLabel();
  try{
    if(!s.gistId){ const list = await gh('/gists?per_page=100'); const g = list.find(x=>x.files&&x.files[MEMFILE])||list.find(x=>x.files&&x.files[OLDFILE]); if(g) s.gistId = g.id; }
    if(s.gistId){
      let g = null; try{ g = await gh('/gists/'+s.gistId); }catch(e){ if(e.status!==404) throw e; s.gistId = ''; }
      if(g){
        const f = g.files&&(g.files[MEMFILE]||g.files[OLDFILE]); let txt = f?f.content:''; if(f&&f.truncated) txt = await (await fetch(f.raw_url)).text();
        let remote = null; try{ remote = JSON.parse(txt); }catch(e){}
        if(remote&&mergeRemote(remote)){ saveLocal(); if(!cur&&!$('#createForm')) renderHome(); }
        const mine = memData();
        if(!remote||memCore(remote)!==memCore(mine)) await gh('/gists/'+s.gistId,{method:'PATCH',body:JSON.stringify({files:{[MEMFILE]:{content:JSON.stringify(mine)}}})});
      }
    }
    if(!s.gistId){ const g = await gh('/gists',{method:'POST',body:JSON.stringify({description:'Cali\'s Tavern saves',public:false,files:{[MEMFILE]:{content:JSON.stringify(memData())}}})}); s.gistId = g.id; }
    s.lastSync = Date.now(); memState = ''; memErr = '';
  }catch(e){ memState = 'err'; memErr = e.message||'Sync failed.'; }
  syncing = false; saveLocal(); memLabel();
  if(syncAgain){ syncAgain = false; scheduleSync(); }
}

// Keep devices in step while the game is open: check again when you come back to the tab, and every so often while it is visible.
document.addEventListener('visibilitychange',()=>{ if(!store.settings.memToken) return; if(document.hidden){ if(syncT){ clearTimeout(syncT); sync(); } } else if(Date.now()-lastTry>8000) sync(); });
setInterval(()=>{ if(store.settings.memToken&&!document.hidden&&!busy&&!rolling&&Date.now()-lastTry>40000) sync(); },10000);

/* ============ linking another device ============ */
const b64u = {enc:o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/')))))};
const loadScript = src => new Promise((ok,no)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = no; document.head.appendChild(e); });
function linkUrl(){ const s = store.settings; return location.href.split('#')[0]+'#link='+b64u.enc({t:s.memToken,k:s.apiKey,u:s.baseUrl}); }
let pendingLink = null;
(function(){ const m = /^#link=([\w-]+)$/.exec(location.hash); if(!m) return;
  try{ const j = b64u.dec(m[1]); if(typeof j.t==='string'&&/^[\w-]{20,255}$/.test(j.t)) pendingLink = j; }catch(e){}
  history.replaceState(null,'',location.pathname+location.search); })();
function askLink(){
  const j = pendingLink; if(!j) return; let host = ''; try{ host = new URL(j.u).host; }catch(e){}
  $('#modalRoot').innerHTML = `<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="Link this device">
    <h3>Link this device?</h3><div class="hint" style="font-size:14px">This link came from another device. Linking will connect this one to that device's memory, so your tales and settings appear here and stay in step.${j.k?` It also brings the narrator's API key${host?' for '+esc(host):''}.`:''}<br><br>Only accept this if you made the link yourself.</div>

// How well or badly a d20 roll went, from three things: the natural die, how far the total landed from the target, and how lopsided that gap is.
// The ladder runs from ruin to overwhelming. A die of 15 or more lifts the result a rung and a die of 5 or less drops it one, without turning a failure into a success or the reverse.

  ['disaster','It fails and makes matters plainly worse.'],
  ['below expectations','It fails clearly, and at a cost.'],
  ['just short','It does not work, but nothing is lost and there may still be an opening.'],
  ['meets the mark','It works, no more than that, perhaps at a small cost.'],
  ['above expectations','It works cleanly and a little better than hoped.'],
  ['triumph','It succeeds and brings something extra with it.'],
  ['overwhelming','It succeeds so thoroughly that it changes the situation.']];

    +(m===null?'':m>=15?` The bar was cleared by ${m}, so this goes further still: the result is absurd, the kind of thing that gets retold for years, and everything about it tips the player's way.`:m>=10?` The bar was cleared by ${m}: push it past legendary, more than anyone present would have believed.`:m<0?' The total fell short of the target, but a natural 20 succeeds anyway.':'');
  if(pick===1) return 'Degree: CATASTROPHE (natural 1). The worst plausible outcome. It backfires and leaves things worse than before.'
    +(m===null?'':m<=-15?` It missed by ${-m}, so this goes further still: a ruinous, memorable calamity with consequences that last.`:m<=-10?` It missed by ${-m}: make it worse than an ordinary catastrophe.`:m>=0?' The total reached the target, but a natural 1 fails anyway.':'');

function closeShop(){
  closeModal(); if(!cur) return;
  if(shopTrades.length){ cur.log.push({role:'note',text:`Trade at ${cur.shop?cur.shop.name:'the shop'}: ${shopTrades.join('; ')}. Purse now ${cur.character.gold} gp.`}); shopTrades = []; save(); }

async function haggle(){
  const c = cur, sp = c.shop; if(!sp||sp.haggled||rolling) return; const bonus = skillMod(c.character,'Persuasion');
  closeModal(); rolling = true; const opened = await openTray();
  const pick = (await throwDice([{n:1,sides:20}]))[0][0], total = pick+bonus; flare(pick);
  sp.haggled = true; sp.mult = total>=18?0.75:total>=13?0.9:total<=7?1.1:1;
  const t = `Haggling at ${sp.name}: Persuasion d20 rolled ${pick} ${sgn(bonus)} = ${total}. ${sp.mult<1?`Prices drop by ${Math.round((1-sp.mult)*100)}%.`:sp.mult>1?'The keeper takes offence; prices rise by 10%.':'The keeper will not budge.'}`;
  pushTray(total,t); c.log.push({role:'note',text:t}); save(); await sleep(1300); rolling = false; closeTray(opened); renderGame(); openShop();

// Healing items are settled here with a real roll. Everything else becomes the player's action for the narrator to resolve.
async function useItem(k){
  const c = cur, ch = c.character, it = ch.inventory[k]; if(!it||busy||rolling) return; const u = useOf(it);
  if(!u||!u.heal){ if(!wide()) closeDrawers(); playerAct(`I use my ${it.name}.`); return; }
  if(ch.hp>=ch.maxHp){ toast('!',`You are at full health. The ${it.name} stays in your pack.`); return; }
  const d = rollExpr(u.heal); rolling = true; const opened = await openTray();
  const vals = (await throwDice([{n:d.rolls.length,sides:d.sides}]))[0], sum = Math.max(1,vals.reduce((a,x)=>a+x,0)+d.bonus), before = ch.hp;
  ch.hp = clamp(ch.hp+sum,0,ch.maxHp); const at = ch.inventory.indexOf(it); if(at>=0){ it.qty -= 1; if(it.qty<=0) ch.inventory.splice(at,1); } refresh(ch);
  const t = `Used ${it.name}: ${d.text} rolled ${vals.join('+')}${d.bonus?sgn(d.bonus):''} = ${sum}. Healed ${ch.hp-before} hit points (now ${ch.hp}/${ch.maxHp}).`;
  pushTray(sum,t); c.log.push({role:'note',text:t}); save(); await sleep(1100); rolling = false; closeTray(opened); renderGame();
}

function saveItem(f){
  const ch = cur.character, k = num(f.dataset.k), it = k>=0?ch.inventory[k]:{};
  it.name = f.name.value.trim().slice(0,60); if(f.type.value) it.type = f.type.value; else delete it.type; it.qty = clamp(num(f.qty.value)||1,1,9999); if(f.weight.value.trim()==='') delete it.weight; else it.weight = clamp(Number(f.weight.value)||0,0,2000);
  const pr = num(f.price.value); if(pr>0) it.price = pr; else delete it.price;
  const d = f.desc.value.trim(); if(d) it.desc = d; else delete it.desc;
  const heal = f.heal.value.replace(/\s/g,''); if(heal&&rollExpr(heal)) it.use = {heal}; else delete it.use;
  classify(it);
  const dmg = f.dmg.value.replace(/\s/g,''); if(it.type==='weapon'){ it.dmg = dmg&&rollExpr(dmg)?dmg:it.dmg; if(k>=0||f.props.value) it.props = f.props.value; } else { delete it.dmg; delete it.props; }
  if(it.type==='armor'){ const b = num(f.abase.value); it.armor = b>=10?{base:Math.min(20,b),dex:f.adex.value,kind:'worn'}:it.armor; } else delete it.armor;
  if(k<0) ch.inventory.push(it); refresh(ch); rebase(cur,['character']); save(); closeModal(); renderSide(); chrome(true);
}

    ch.level = clamp(num(f.level.value)||1,1,20); ch.xp = Math.max(0,num(f.xp.value)); ch.maxHp = Math.max(1,num(f.maxHp.value)||1); ch.hp = clamp(num(f.hp.value),0,ch.maxHp); ch.gold = Math.max(0,num(f.gold.value)); ch.acMisc = clamp(num(f.acMisc.value),-10,10);
    ABIL.forEach(a=>{ ch.abilities[a] = clamp(num(f['ab_'+a].value)||10,1,30); });

  else if(gsTab==='people'){ const name = f.name.value.trim().slice(0,50); if(!name) return; c.npcs ||= {}; c.present ||= [];
    const old = gsWho!=='__new'?c.npcs[gsWho]:null, n = old||{traits:[],skills:[],memory:[]};
    if(old&&gsWho!==name){ delete c.npcs[gsWho]; c.present = c.present.map(x=>x===gsWho?name:x); }
    Object.assign(n,{name,bond:clamp(num(f.bond.value),-10,10),stance:f.stance.value,attitude:f.attitude.value.trim().slice(0,40)||f.stance.value,wants:f.wants.value.trim().slice(0,120),about:f.about.value.trim().slice(0,240),aka:csv(f.aka.value).slice(0,6).map(x=>x.slice(0,50)),traits:csv(f.traits.value).slice(0,12).map(x=>x.slice(0,60)),skills:csv(f.skills.value).slice(0,6).map(x=>x.slice(0,40)),
      memory:f.memory.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,12).map(x=>({t:x.replace(/^\*\s*/,'').slice(0,140),k:x.startsWith('*')}))});
    c.npcs[name] = n; gsWho = name; c.present = c.present.filter(x=>x!==name); if(f.here.checked) c.present = [name,...c.present].slice(0,3); }
  else { c.location = f.location.value.trim().slice(0,80); c.mood = f.mood.value; c.summary = f.summary.value.trim(); c.facts = f.facts.value.split('\n').map(x=>x.trim().slice(0,340)).filter(Boolean).slice(0,60);
    c.quests = [...f.querySelectorAll('.qrow')].map(r=>({title:r.querySelector('[name=qt]').value.trim().slice(0,80),status:r.querySelector('[name=qs]').value,note:r.querySelector('[name=qn]').value.trim().slice(0,240)})).filter(q=>q.title); }
  if(c){ if(gsTab==='char') rebase(c,['character']); else if(gsTab==='people') rebase(c,['npcs','present']); else if(gsTab==='world') rebase(c,['quests','location','mood','facts']); }
  save(); if(c){ renderGame(); } else renderHome();
}

function readSettings(){ const f = $('#setForm'); if(!f) return; Object.assign(store.settings,{baseUrl:f.baseUrl.value.trim()||DEFAULTS.baseUrl,apiKey:f.apiKey.value.trim(),model:f.model.value.trim()||DEFAULTS.model,
  temperature:clamp(Number(f.temperature.value)||0,0,2),maxTokens:clamp(num(f.maxTokens.value)||1000,200,8000),stream:f.stream.checked,localProxy:f.localProxy.checked,gateModel:f.gateModel.value.trim(),charModel:f.charModel.value.trim(),checkModel:f.checkModel.value.trim(),forgeModel:f.forgeModel.value.trim(),sheetModel:f.sheetModel.value.trim()});
  const tok = f.memToken.value.trim(); if(tok!==store.settings.memToken) Object.assign(store.settings,{memToken:tok,gistId:'',lastSync:0});
  if(!/^https?:\/\/[^\s/]+/i.test(store.settings.baseUrl)){ store.settings.baseUrl = DEFAULTS.baseUrl; f.baseUrl.value = DEFAULTS.baseUrl; toast('!','The base URL has to be a web address, so it was reset to OpenRouter. Model names go in the Model box.'); } }
function closeModal(){ $('#modalRoot').innerHTML = ''; }

/* ============ events ============ */
function go(){ const id = location.hash.slice(1); if(id==='new') return renderCreate(); if(store.campaigns[id]){ denied = null; selEntry = editEntry = -1; cur = store.campaigns[id]; upgrade(cur); store.last = id; saveLocal(); lastErr = null; main.innerHTML = ''; renderGame(); if(!cur.log.length) takeTurn(null); return; } renderHome(); }
window.addEventListener('hashchange',()=>{ if(aborter) aborter.abort(); busy = false; go(); });

document.addEventListener('click',async ev=>{
  const el = ev.target.closest('[data-act]');
  if(!el){ // tapping an entry in the chat picks it; tapping it again, or elsewhere, lets go
    const en = ev.target.closest('#log .e[data-i]'); if(cur&&!busy&&!ev.target.closest('.eedit')&&!String(getSelection()).trim()){ const i = en?num(en.dataset.i):-1;
      if(i!==selEntry||(i<0&&selEntry>=0)){ if(en||ev.target.closest('#log')){ const keep = $('#log').scrollTop; selEntry = i===selEntry?-1:i; editEntry = -1; renderLog(); if(selEntry<0) $('#log').scrollTop = keep; } }
      else if(en){ const keep = $('#log').scrollTop; selEntry = -1; editEntry = -1; renderLog(); $('#log').scrollTop = keep; } }
    return; }
  const act = el.dataset.act, c = cur;
  switch(act){
    case 'home': location.hash = ''; if(!location.hash) go(); break;
    case 'create': draft = null; location.hash = 'new'; break;
    case 'open': if(cur&&cur.id===el.dataset.id&&!wide()) closeDrawers(); location.hash = el.dataset.id; break;
    case 'settings': openSettings(); break;
    case 'closeModal': closeModal(); break;
    case 'closeModalBg': if(ev.target===el) closeModal(); break;
    case 'toggleSide': drawer('right'); break;
    case 'toggleLeft': drawer('left'); break;
    case 'closeDrawers': closeDrawers(); break;
    case 'del': { const x = store.campaigns[el.dataset.id]; if(x&&confirm(`Delete "${x.title}"? This cannot be undone.`)){ delete store.campaigns[el.dataset.id]; store.deleted[el.dataset.id] = Date.now(); if(store.last===el.dataset.id) store.last = null; save(); renderHome(); } break; }
    case 'export': { const x = store.campaigns[el.dataset.id]; if(!x) break; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));
      a.download = x.title.replace(/[^\w-]+/g,'_')+'.calis-tavern.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); break; }
    case 'import': $('#importFile').click(); break;
    case 'randName': draft.name = NAMES[rnd(NAMES.length)-1]; renderCreate(); break;
    case 'forge': forge(); break;
    case 'forgeStory': forgeStory(); break;
    case 'step': draft.step = num(el.dataset.k); renderCreate(); main.scrollTop = 0; break;
    case 'stepBack': draft.step = Math.max(0,draft.step-1); renderCreate(); main.scrollTop = 0; break;
    case 'cancelCreate': draft = null; location.hash = ''; if(!location.hash) go(); break;
    case 'presetStats': draft.abilities = presetFor(classDef(draft)); draft.abTouched = false; renderCreate(); break;
    case 'rollStats': placeStats(rollArray()); draft.abTouched = true; renderCreate(); break;
    case 'stdArray': placeStats([15,14,13,12,10,8]); draft.abTouched = true; renderCreate(); break;
    case 'tab': tab = el.dataset.tab; renderSide(); break;
    case 'sugg': if(!busy){ const ta = $('#say'); if(ta) ta.value = ''; playerAct(el.textContent,true); } break;
    case 'pend': resolvePending(el.dataset.adv); break;
    case 'stop': if(aborter) aborter.abort(); break;
    case 'retry': takeTurn(null); break;
    case 'regen': regenerate(); break;
    case 'sayRoll': { const ta = $('#say'), t = (ta?.value||'').trim(); if(busy||rolling) break; if(!t){ toast('!','Type what you attempt first, then tap the die to send it with a roll.'); break; } ta.value = ''; playerAct(t,false,false,true); break; }
    case 'force': if(denied&&!busy){ const t = denied.text; const ta = $('#say'); if(ta) ta.value = ''; playerAct(t,true,true); } break;
    case 'dmEnter': if(cur&&!busy) enterDm(cur,false); break;
    case 'dmExit': exitDm(); break;
    case 'dmClear': { const c = cur; if(!c||busy||!(c.dmChat||[]).length) break;
      if(!confirm(`Clear this chat with ${dmName()}? The story is not touched, and the facts already settled are kept (you can edit those in Settings, World).`)) break;
      c.dmChat = []; lastErr = null; c.updated = Date.now(); save(); renderGame(); break; }
    case 'tableReset': { if(!confirm('Put the table back to how it started? This resets difficulty, how the DM writes, the narrator and the checks. Your models, key, tales and lorebooks are not touched.')) break;
      for(const k of TABLE_KEYS) store.settings[k] = DEFAULTS[k]; store.prefsAt = Date.now(); if(cur) refresh(cur.character); save(); openGame('game'); if(cur) renderGame(); toast('Table reset','Everything on this tab is back to its defaults.'); break; }
    case 'eEdit': editEntry = selEntry; renderLog(); $('#eBox')?.focus(); break;
    case 'eCancel': editEntry = -1; renderLog(); break;
    case 'eSave': case 'eSaveRedo': { const e = c.log[selEntry], v = ($('#eBox')?.value||'').trim(); if(!e||!v) break;
      if(e.role==='aside') e.a = v; else e.text = v; const at = selEntry; editEntry = -1; c.updated = Date.now(); save();
      if(act==='eSaveRedo') redoEntry(at); else renderLog(); break; }
    case 'eRedo': redoEntry(selEntry); break;
    case 'eCopy': { const e = c.log[selEntry]; if(!e) break; const t = e.role==='aside'?`${e.q}\n${e.a}`:e.text;
      try{ await navigator.clipboard.writeText(t); el.textContent = 'Copied'; }catch(err){ el.textContent = 'Could not copy'; } break; }
    case 'eDel': { const e = c.log[selEntry]; if(!e) break; if(!confirm('Delete this entry from the tale? Your sheet is not changed.')) break;
      c.log.splice(selEntry,1); c.sumIdx = Math.min(c.sumIdx||0,c.log.length); selEntry = editEntry = -1; c.updated = Date.now(); save(); renderGame(); break; }
    case 'hp': c.character.hp = clamp(c.character.hp+num(el.dataset.d),0,c.character.maxHp); save(); renderSide(); break;
    case 'drop': c.character.inventory.splice(num(el.dataset.k),1); refresh(c.character); save(); renderSide(); break;
    case 'use': useItem(num(el.dataset.k)); break;
    case 'equip': case 'equipOff': { const it = c.character.inventory[num(el.dataset.k)]; if(!it) break; const err = equip(c.character,it,act==='equipOff'?'off':'main'); if(err) toast('!',err); save(); renderSide(); chrome(true); break; }
    case 'unequip': { const it = c.character.inventory[num(el.dataset.k)]; if(it){ delete it.eq; refresh(c.character); save(); renderSide(); } break; }
    case 'editItem': openItem(num(el.dataset.k)); break;
    case 'delItem': c.character.inventory.splice(num(el.dataset.k),1); refresh(c.character); rebase(c,['character']); save(); closeModal(); renderSide(); break;
    case 'atk': { const w = weaponInfo(c.character); freeRoll(`${w.name} attack`,w.hit); break; }
    case 'skipRoll': { const r = c.pendingRoll; if(!r||busy) break; const t = `${r.label}: passed without rolling (god mode). Treat it as a clear success.`; if(r.ask){ c.pendingRoll = null; answerAside(c,r.ask,t); } else takeTurn({role:'roll',text:t}); break; }
    case 'gameSettings': openGame(); break;
    case 'install': if(installEvt){ const ev2 = installEvt; installEvt = null; ev2.prompt(); ev2.userChoice.finally(()=>{ if(!cur&&!$('#createForm')) renderHome(); }); } break;
    case 'gsTab': saveGame(); loreEdit = ''; openGame(el.dataset.tab); break;
    case 'loreNew': { saveGame(); const b = {id:'u'+Date.now().toString(36)+rnd(1e6).toString(36),name:'My lorebook',about:'',entries:[]}; store.lore.books.push(b); loreEdit = b.id; save(); openGame('lore'); break; }
    case 'loreOpen': saveGame(); loreEdit = el.dataset.id; openGame('lore'); break;
    case 'loreBack': saveGame(); save(); loreEdit = ''; openGame('lore'); break;
    case 'loreAddEntry': $('#lents').insertAdjacentHTML('beforeend','<div class="lent"><div class="row2"><input class="inp" name="ln" maxlength="80" placeholder="Title" aria-label="Entry title"><input class="inp" name="lk" maxlength="300" placeholder="Trigger words, comma separated" aria-label="Trigger words"></div><textarea class="inp" name="lt" maxlength="2000" placeholder="What the DM should know" aria-label="Entry text"></textarea><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><label class="check" style="padding:0"><input type="checkbox" name="la"><span>Always show this to the DM</span></label><button type="button" class="btn small ghost danger" data-act="loreDelEntry">Remove</button></div></div>'); $('#lents').lastElementChild.querySelector('input').focus(); break;
    case 'loreDelEntry': el.closest('.lent').remove(); break;
    case 'loreDel': { const b = store.lore.books.find(x=>x.id===el.dataset.id); if(b&&confirm(`Delete the lorebook "${b.name}"?`)){ saveGame(); store.lore.books = store.lore.books.filter(x=>x!==b); store.loreAt = Date.now(); save(); openGame('lore'); } break; }
    case 'loreExport': { const b = store.lore.books.find(x=>x.id===el.dataset.id); if(!b) break; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({name:b.name,about:b.about,entries:b.entries},null,2)],{type:'application/json'}));
      a.download = b.name.replace(/[^\w-]+/g,'_')+'.lorebook.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); break; }
    case 'loreImport': $('#loreFile').click(); break;
    case 'loreFetch': { const raw = ($('#loreUrl').value||'').trim(), msg = $('#loreMsg'); if(!raw){ msg.textContent = 'Type a file name on this site, or a full web address.'; break; }
      msg.style.color = 'var(--muted)'; msg.textContent = 'Fetching…';
      try{ const url = new URL(raw,location.href); if(!/^https?:$/.test(url.protocol)) throw new Error('That is not a web address.');
        const r = await fetch(url.href+(url.search?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status===404?'No file was found at that address.':'The address answered '+r.status+'.');
        let j; try{ j = await r.json(); }catch(e){ throw new Error('That address did not return a lorebook file.'); }
        saveGame(); const res = addBook(j,url.pathname.split('/').pop().replace(/\.(lorebook\.)?json$/i,'')); openGame('lore'); toast('✓',`${res.replaced?'Replaced':'Imported'} "${res.book.name}" with ${res.book.entries.length} entries.`);
      }catch(e){ msg.style.color = 'var(--danger)'; msg.textContent = e.message==='not a lorebook'?'That file is not a lorebook this game can read.':(e.message||'Could not fetch that address.'); } break; }
    case 'gsAddQuest': $('#gsQuests').insertAdjacentHTML('beforeend','<div class="qrow"><input class="inp" name="qt" maxlength="80" placeholder="Quest title" aria-label="Quest title"><select class="inp" name="qs" aria-label="Quest status"><option value="active">Active</option><option value="done">Done</option><option value="failed">Failed</option></select><input class="inp" name="qn" maxlength="240" placeholder="Note" aria-label="Quest note"><button type="button" class="btn small ghost" data-act="gsDelQuest" aria-label="Remove quest">&#10005;</button></div>'); break;
    case 'gsDelQuest': el.closest('.qrow').remove(); break;

    case 'npc': { tab = 'people'; setDrawer($('#rightD'),true); if(!wide()) setDrawer($('#leftD'),false); openSecs.add('npc-'+el.dataset.n.replace(/\W+/g,'-')); renderSide(); document.getElementById('npc-'+el.dataset.n.replace(/\W+/g,'-'))?.scrollIntoView({block:'start'}); break; }
    case 'shop': shopTrades = shopTrades||[]; openShop(); break;
    case 'shopClose': closeShop(); break;
    case 'shopCloseBg': if(ev.target===el) closeShop(); break;
    case 'haggle': haggle(); break;
    case 'buy': { const sp = c.shop, it = sp&&sp.items[num(el.dataset.k)]; if(!it) break; const pr = shopPrice(it); if(pr>c.character.gold) break;
      c.character.gold -= pr; const {stock,...rest} = it; addItem(c.character,{...rest,qty:1}); refresh(c.character); if(it.stock){ it.stock -= 1; if(it.stock<=0) sp.items.splice(num(el.dataset.k),1); }
      shopTrades.push(`bought ${it.name} for ${pr} gp`); save(); openShop(); break; }

    case 'abil': freeRoll(ABIL_NAME[el.dataset.a]+' check',mod(c.character.abilities[el.dataset.a])); break;
    case 'save': freeRoll(ABIL_NAME[el.dataset.a]+' save',saveMod(c.character,el.dataset.a)); break;
    case 'skill': freeRoll(el.dataset.s+' check',skillMod(c.character,el.dataset.s)); break;
    case 'die': trayRoll(num(el.dataset.d)); break;

    case 'memConnect': { readSettings(); saveLocal(); const out = $('#memout');
      if(!store.settings.memToken){ out.textContent = 'Paste a GitHub token first. "Create a token" opens the right page; keep only the gist box ticked.'; out.style.color = 'var(--danger)'; memLabel(); break; }
      await sync(); break; }
    case 'memLink': { readSettings(); saveLocal(); const out = $('#linkout');
      if(!store.settings.memToken||!store.settings.gistId){ out.textContent = 'Connect and sync on this device first, then you can link others to it.'; break; }
      const url = linkUrl(); let qr = '';
