      out.innerHTML = `${qr?'Scan this with the other device\'s camera, or open the link below on it.':'Open this link on the other device.'}${qr}
        <input class="inp" id="linkField" readonly value="${esc(url)}" aria-label="Link for another device"><div class="actions" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn small" data-act="copyLink">Copy link</button><button type="button" class="btn small ghost" data-act="hideLink">Hide</button></div>
        <div style="margin-top:8px">This code carries your memory token${store.settings.apiKey?' and your API key':''}. Treat it like a password: only show it to your own devices.</div>`;
      clearTimeout(out._t); out._t = setTimeout(()=>{ out.innerHTML = ''; },180000); out.scrollIntoView({block:'nearest'}); break; }
    case 'hideLink': $('#linkout').innerHTML = ''; break;
    case 'copyLink': { const f = $('#linkField'); try{ await navigator.clipboard.writeText(f.value); el.textContent = 'Copied'; }catch(e){ f.select(); el.textContent = 'Select and copy'; } break; }
    case 'linkNo': pendingLink = null; closeModal(); break;
    case 'linkYes': { const j = pendingLink; pendingLink = null; closeModal(); if(!j) break;
      Object.assign(store.settings,{memToken:j.t,gistId:'',lastSync:0}); if(typeof j.k==='string'&&j.k) store.settings.apiKey = j.k;
      try{ if(/^https?:$/.test(new URL(j.u).protocol)) store.settings.baseUrl = j.u; }catch(e){}
      store.prefsAt = 0; saveLocal(); memLabel(); toast('…','Linking and fetching your tales…'); await sync();
      toast(memState==='err'?'!':'✓',memState==='err'?memErr:`Linked. ${Object.keys(store.campaigns).length} tale(s) on this device now.`); if(!cur) renderHome(); break; }
    case 'memOff': { Object.assign(store.settings,{memToken:'',gistId:'',lastSync:0}); memState = ''; saveLocal(); const f = $('#setForm'); if(f) f.memToken.value = '';
      memLabel(); const out = $('#memout'); if(out){ out.textContent = 'Disconnected. Tales stay in this browser, and the gist stays on your GitHub until you delete it.'; out.style.color = 'var(--muted)'; } break; }
    case 'loadModels': { readSettings(); const out = $('#testout'); out.textContent = 'Fetching models…'; out.style.color = 'var(--muted)';
      try{ const {url,headers} = endpoint('/models'); const r = await fetch(url,{headers}); if(!r.ok) throw new Error(r.status+' '+r.statusText); const j = await r.json();
        const ids = (j.data||j.models||[]).map(m=>m.id||m.name).filter(Boolean).sort(); $('#modelList').innerHTML = ids.map(i=>`<option value="${esc(i)}">`).join('');
        out.textContent = ids.length?`${ids.length} models loaded. Start typing in the model box to search.`:'The endpoint returned no models. Type the model id by hand.'; out.style.color = 'var(--good)';
      }catch(e){ out.textContent = 'Could not load the list ('+e.message+'). You can still type a model id by hand.'; out.style.color = 'var(--danger)'; } break; }
    case 'test': { readSettings(); const out = $('#testout'); out.textContent = 'Asking the narrator to clear their throat…'; out.style.color = 'var(--muted)';
      try{ const t = await chat([{role:'user',content:'Reply with the single word: ready'}],{stream:false,maxTokens:200,temperature:0}); out.textContent = 'Connected. The model answered: '+(t.trim().slice(0,80)||'(empty reply)'); out.style.color = 'var(--good)'; }
      catch(e){ out.textContent = e.message; out.style.color = 'var(--danger)'; } break; }
  }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault(); const f = ev.target;
  if(f.id==='sendForm'){ const t = $('#say').value.trim(); if(t&&!busy){ $('#say').value = ''; if(cur&&cur.inDm) dmSay(t); else playerAct(t); } }
  else if(f.id==='itemForm'){ if(f.name.value.trim()) saveItem(f); }
  else if(f.id==='gsForm'){ saveGame(); closeModal(); }
  else if(f.id==='setForm'){ readSettings(); store.prefsAt = Date.now(); save(); closeModal(); if(!cur) renderHome(); else if(!cur.log.length&&!busy) takeTurn(null); }
  else if(f.id==='createForm'){
    const d = draft; if(!d||forging) return;
    if(d.step===0){ if(!d.name.trim()){ d.msg = 'Give your character a name, or let the model build one.'; renderCreate(); return; }
      if(d.race==='__custom'&&!d.cRace.name.trim()){ d.msg = 'Name your custom race.'; renderCreate(); return; }
      if(d.cls==='__custom'&&!d.cCls.name.trim()){ d.msg = 'Name your custom class.'; renderCreate(); return; } }
    if(d.step>=3&&d.boons.length>d.flaws.length){ d.step = 3; d.msg = 'Every boon is paid for with a flaw. Pick another flaw, or go back and give up a boon.'; renderCreate(); return; }
    if(d.step===5&&d.camp==='custom'&&!d.campText.trim()){ d.msg = 'Write a line or two about your campaign, or pick one from the list.'; renderCreate(); return; }
    if(d.step<6){ d.step++; d.seen = Math.max(d.seen,d.step); renderCreate(); main.scrollTop = 0; return; }
    const camp = CAMPAIGNS.find(x=>x.id===d.camp)||CAMPAIGNS[0];
    const character = newCharacter(d), id = 'c'+Date.now().toString(36)+rnd(1e6).toString(36);
    store.campaigns[id] = {id,title:d.camp==='surprise'?`${character.name}'s tale`:d.camp==='custom'?(d.campTitle.trim().slice(0,60)||`${character.name}'s tale`):camp.title,created:Date.now(),updated:Date.now(),tone:d.tone||'classic',character,
      premise:d.camp==='surprise'?SURPRISE:d.camp==='custom'?`${d.campTitle.trim()?d.campTitle.trim()+'. ':''}${d.campText.trim()}\nThis premise was written by the player: keep to it faithfully, and fit this character into it.`:`${camp.title}. ${camp.text}\nKeep to this premise, and fit this particular character into it: their background, backstory, boons and flaws should matter.`,
      quests:[],location:'',summary:'',sumIdx:0,log:[],suggestions:[],pendingRoll:null};
    draft = null; save(); location.hash = id;
  }
});
function setDraft(path,v){ const k = path.split('.'); if(k.length===2) draft[k[0]][k[1]] = v; else draft[k[0]] = v; }
document.addEventListener('change',ev=>{
  const t = ev.target;
  if(draft&&(t.name==='boons'||t.name==='flaws')&&t.form?.id==='createForm'){ const list = draft[t.name], k = list.indexOf(t.value);
    if(t.checked&&k<0&&list.length<2) list.push(t.value); else if(!t.checked&&k>=0) list.splice(k,1); renderCreate(); }
  if(draft&&t.name==='camp'&&t.form?.id==='createForm'){ draft.camp = t.value; renderCreate(); }
  if(draft&&t.dataset.d&&t.tagName==='SELECT'){ setDraft(t.dataset.d,t.value); if(t.dataset.re){ if(!draft.abTouched) draft.abilities = presetFor(classDef(draft)); renderCreate(); } }
  if(t.id==='packSort'){ store.ui.sort = t.value; saveLocal(); renderSide(); }
  if(t.id==='loreFile'&&t.files[0]){ const file = t.files[0]; file.text().then(txt=>{ saveGame(); const r = addBook(JSON.parse(txt),file.name.replace(/\.(lorebook\.)?json$/i,''));
    openGame('lore'); toast('✓',`${r.replaced?'Replaced':'Imported'} "${r.book.name}" with ${r.book.entries.length} entries.`); }).catch(()=>toast('!','That file is not a lorebook this game can read.')); }
  if(t.id==='dmPickSel'){ saveGame(); openGame('game'); }
  if(t.id==='gsWho'){ gsWho = t.value; openGame('people'); }
  if(t.id==='importFile'&&t.files[0]){ t.files[0].text().then(txt=>{ const x = JSON.parse(txt); if(!x.character||!Array.isArray(x.log)) throw 0;
    x.id = 'c'+Date.now().toString(36)+rnd(1e6).toString(36); x.updated = Date.now(); x.quests ||= []; x.suggestions ||= []; store.campaigns[x.id] = x; saveLocal(); scheduleSync(); renderHome(); toast('✓','Tale imported.'); })
    .catch(()=>toast('!','That file is not a Tavern save.')); }
});
document.addEventListener('input',ev=>{
  const t0 = ev.target;
  if(draft&&t0.dataset.d&&t0.tagName!=='SELECT') setDraft(t0.dataset.d,t0.value);
  if(draft&&t0.dataset.ab){ draft.abilities[t0.dataset.ab] = t0.value; draft.abTouched = true; const r = raceDef(draft).bonus[t0.dataset.ab]||0; $('#m_'+t0.dataset.ab).textContent = sgn(mod(clamp(num(t0.value)||10,3,18)+r))+(r?` (+${r})`:''); }
  if(ev.target.id==='say'){ const t = ev.target; t.style.height = 'auto'; t.style.height = Math.min(160,t.scrollHeight+2)+'px'; }
});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='say'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ ev.preventDefault(); $('#sendForm').requestSubmit(); }
  if(ev.key==='Escape'){ if($('.modal.shop')) closeShop(); else if($('#modalRoot').firstChild) closeModal(); else if(!wide()&&$('#game')) closeDrawers(); }
});

matchMedia('(min-width:901px)').addEventListener('change',()=>{ if($('#game')){ setDrawer($('#leftD'),wide()&&!!store.ui.left); setDrawer($('#rightD'),wide()&&!!store.ui.right); } });
// Browsers keep a saved copy of the page for a while. Ask the site which version is current and offer to load it.
const BUILD = '202611172323';
async function checkVersion(){
  try{ const r = await fetch('version.txt?'+Date.now(),{cache:'no-store'}); if(!r.ok) return; const v = (await r.text()).trim();
    if(/^\d{12}$/.test(v)&&v>BUILD&&!busy&&!rolling) toast('↻','A newer version is ready.',{label:'Update',reload:v}); }catch(e){}
}
if(location.protocol!=='file:'){ checkVersion(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkVersion(); }); setInterval(()=>{ if(!document.hidden) checkVersion(); },300000); }
/* ============ keeping two open copies of the game in step ============ */
// The installed app and a browser tab (or two tabs) share one saved store. Without this, the copy that was opened earlier still holds
// the old sheet in memory and writes it back over the newer one the next time it saves.
function adoptStore(){
  staleStore = false; const id = cur&&cur.id, creating = !!$('#createForm'); loadStore();
  if(id){ cur = store.campaigns[id]||null; if(cur){ upgrade(cur); renderGame(); } else renderHome(); } else if(!creating&&!$('#modalRoot').firstChild) renderHome();
  memLabel();
}
window.addEventListener('storage',e=>{ if(e.key!==KEY||!e.newValue) return; if(busy||rolling||$('#modalRoot').firstChild||$('#createForm')){ staleStore = true; return; } adoptStore(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&staleStore&&!busy&&!rolling&&!$('#modalRoot').firstChild&&!$('#createForm')) adoptStore(); });

/* ============ dropdowns ============ */
let ddOpen = null;
function closeDD(focus){ if(!ddOpen) return; const {pop,btn} = ddOpen; ddOpen = null; pop.remove(); btn.setAttribute('aria-expanded','false'); if(focus&&document.contains(btn)) btn.focus({preventScroll:true}); }
function openDD(sel,btn){
  if(ddOpen){ const same = ddOpen.btn===btn; closeDD(); if(same) return; }
  const pop = document.createElement('div'); pop.className = 'ddp'; pop.setAttribute('role','listbox'); pop.tabIndex = -1;
  const opts = [...sel.options]; let act = Math.max(0,sel.selectedIndex);
  pop.innerHTML = opts.map((o,i)=>`<div role="option" data-i="${i}" aria-selected="${i===sel.selectedIndex}">${esc(o.textContent)}</div>`).join('');
  document.body.appendChild(pop); btn.setAttribute('aria-expanded','true'); ddOpen = {pop,btn,at:Date.now()};
  const r = btn.getBoundingClientRect(), below = innerHeight-r.bottom-12, above = r.top-12, up = below<220&&above>below, room = Math.max(140,Math.min(340,up?above:below));
  Object.assign(pop.style,{left:Math.max(8,Math.min(r.left,innerWidth-r.width-8))+'px',width:r.width+'px',maxHeight:room+'px'});
  if(up) pop.style.bottom = (innerHeight-r.top+4)+'px'; else pop.style.top = (r.bottom+4)+'px';
  const mark = () => { [...pop.children].forEach((d,i)=>d.classList.toggle('act',i===act)); const d = pop.children[act]; if(!d) return;
    if(d.offsetTop<pop.scrollTop) pop.scrollTop = d.offsetTop-4; else if(d.offsetTop+d.offsetHeight>pop.scrollTop+pop.clientHeight) pop.scrollTop = d.offsetTop+d.offsetHeight-pop.clientHeight+4; };
  const choose = i => { const changed = sel.selectedIndex!==i; sel.selectedIndex = i; closeDD(true); if(changed) sel.dispatchEvent(new Event('change',{bubbles:true})); };
  mark(); pop.focus({preventScroll:true}); let typed = '', typedAt = 0;
  pop.addEventListener('click',e=>{ const d = e.target.closest('[data-i]'); if(d) choose(num(d.dataset.i)); });
  pop.addEventListener('mousemove',e=>{ const d = e.target.closest('[data-i]'); if(d&&num(d.dataset.i)!==act){ act = num(d.dataset.i); [...pop.children].forEach((x,i)=>x.classList.toggle('act',i===act)); } });
  pop.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ act = Math.min(opts.length-1,act+1); mark(); } else if(e.key==='ArrowUp'){ act = Math.max(0,act-1); mark(); }
    else if(e.key==='Home'){ act = 0; mark(); } else if(e.key==='End'){ act = opts.length-1; mark(); }
    else if(e.key==='Enter'||e.key===' '){ choose(act); } else if(e.key==='Escape'||e.key==='Tab'){ closeDD(true); }
    else if(e.key.length===1){ const now = Date.now(); typed = (now-typedAt>700?'':typed)+e.key.toLowerCase(); typedAt = now; const k = opts.findIndex(o=>o.textContent.trim().toLowerCase().startsWith(typed)); if(k>=0){ act = k; mark(); } }
    else return; e.preventDefault(); e.stopPropagation(); });
}
function enhanceSelect(sel){
  if(sel._dd||!sel.classList.contains('inp')||sel.multiple) return; sel._dd = true;
  const wrap = document.createElement('span'); wrap.className = 'dd'; sel.parentNode.insertBefore(wrap,sel); wrap.appendChild(sel); sel.tabIndex = -1; sel.setAttribute('aria-hidden','true');
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'inp ddb'; btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  const lbl = sel.closest('label'), name = sel.getAttribute('aria-label')||(lbl&&lbl.firstChild&&lbl.firstChild.nodeType===3?lbl.firstChild.textContent.trim():'')||'Choose';
  const show = () => { const o = sel.options[sel.selectedIndex]; btn.innerHTML = `<span>${esc(o?o.textContent:'')}</span>`; btn.setAttribute('aria-label',`${name}: ${o?o.textContent:''}`); };
  show(); wrap.appendChild(btn); sel.addEventListener('change',show);
  btn.addEventListener('click',e=>{ e.preventDefault(); openDD(sel,btn); });
  btn.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); openDD(sel,btn); } });
}
new MutationObserver(()=>{ document.querySelectorAll('select.inp').forEach(enhanceSelect); if(ddOpen&&!document.contains(ddOpen.btn)) closeDD(); }).observe(document.body,{childList:true,subtree:true});
document.addEventListener('pointerdown',e=>{ if(ddOpen&&!ddOpen.pop.contains(e.target)&&!ddOpen.btn.contains(e.target)) closeDD(); },true);
document.addEventListener('scroll',e=>{ if(ddOpen&&Date.now()-ddOpen.at>250&&e.target!==ddOpen.pop&&!(e.target.nodeType===1&&ddOpen.pop.contains(e.target))) closeDD(); },true);
window.addEventListener('resize',()=>closeDD());

/* ============ install as an app ============ */
let installEvt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const installLine = () => standalone()?'':installEvt?'<button class="btn small" data-act="install">Install as an app</button>'
  :`<span class="hint">To install as an app: ${/iphone|ipad|ipod/i.test(navigator.userAgent)?'tap Share, then "Add to Home Screen".':'open your browser menu and choose "Install app" or "Add to Home screen".'}</span>`;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt = e; if(!cur&&!$('#createForm')) renderHome(); });
window.addEventListener('appinstalled',()=>{ installEvt = null; toast('✓','Installed. Check your home screen.'); if(!cur&&!$('#createForm')) renderHome(); });
if('serviceWorker' in navigator&&location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});

(function(){ const f = $('#flies'); for(let i=0;i<16;i++){ const s = document.createElement('i'); s.style.left = Math.random()*100+'%'; s.style.top = 25+Math.random()*75+'%';
  s.style.animationDelay = (-Math.random()*14)+'s'; s.style.animationDuration = 10+Math.random()*10+'s'; f.appendChild(s); } })();

go(); memLabel(); if(pendingLink) askLink(); else if(store.settings.memToken) sync();
